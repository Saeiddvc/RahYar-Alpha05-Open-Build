name: KifNex 0.1.0-alpha.26 Real Data Pilot V2

on:
  push:
    paths:
      - 'kifnex026-v2-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REF: kifnex-alpha26-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: buildrepo
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply source patches
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          python3 patch_alpha21.py
          python3 patch_alpha22.py
          python3 patch_alpha22b.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha23.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha23_ui.py
          python3 patch_alpha24.py || true
          python3 patch_alpha24_datafix.py
          python3 patch_alpha24b_hotfix.py
          python3 patch_alpha24b.py
          python3 patch_alpha24_ui.py
          python3 patch_alpha24_dialogstack.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha25_investmentlab.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha26_realdata.py
          python3 patch_alpha26_testentry.py
          python3 patch_alpha21_compilefix.py
          grep -q 'PersianNameValidator.isValid' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'showBankObservationPage' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'FinancialNotificationListener' app/src/main/AndroidManifest.xml

      - name: Prepare stable signing and IRANSans
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          openssl pkcs12 -export -inkey kifnex-alpha-test-key.pem -in kifnex-alpha-test-cert.pem -name kifnex-alpha -out kifnex-alpha-test.p12 -passout pass:kifnexAlpha2026
          rm -f app/kifnex-alpha-test.keystore
          keytool -importkeystore -srckeystore kifnex-alpha-test.p12 -srcstoretype PKCS12 -srcstorepass kifnexAlpha2026 -srcalias kifnex-alpha -destkeystore app/kifnex-alpha-test.keystore -deststoretype JKS -deststorepass kifnexAlpha2026 -destkeypass kifnexAlpha2026 -destalias kifnex-alpha -noprompt
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf

      - name: Pure calculation and parser tests
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          rm -rf pure-out && mkdir pure-out
          javac -d pure-out app/src/main/java/ir/kifnex/app/InvestmentCalculator.java app/src/main/java/ir/kifnex/app/InvestmentCatalog.java app/src/main/java/ir/kifnex/app/BankSmsAnalyzer.java app/src/main/java/ir/kifnex/app/PersianNameValidator.java calculator-tests/ir/kifnex/app/InvestmentCalculatorTest.java parser-tests/ir/kifnex/app/BankSmsAnalyzerTest.java parser-tests/ir/kifnex/app/PersianNameValidatorTest.java
          java -cp pure-out ir.kifnex.app.InvestmentCalculatorTest | tee kifnex026-calculator-tests.txt
          java -cp pure-out ir.kifnex.app.BankSmsAnalyzerTest | tee kifnex026-bank-parser-tests.txt
          java -cp pure-out ir.kifnex.app.PersianNameValidatorTest | tee kifnex026-name-tests.txt
          grep -q PASSED kifnex026-calculator-tests.txt
          grep -q PASSED kifnex026-bank-parser-tests.txt
          grep -q PASSED kifnex026-name-tests.txt

      - name: Build and verify APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.26-realdata.apk
          sha256sum KifNex-0.1.0-alpha.26-realdata.apk > KifNex-0.1.0-alpha.26-realdata.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.26-realdata.apk > kifnex026-badging.txt
          "$AAPT" dump permissions KifNex-0.1.0-alpha.26-realdata.apk > kifnex026-permissions.txt
          grep -q "package: name='ir.kifnex.app'" kifnex026-badging.txt
          grep -q "versionName='0.1.0-alpha.26'" kifnex026-badging.txt
          ! grep -q 'android.permission.READ_SMS' kifnex026-permissions.txt
          ! grep -q 'android.permission.RECEIVE_SMS' kifnex026-permissions.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KifNex-0.1.0-alpha.26-realdata.apk > kifnex026-cert.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 real-data screen smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: bash smoke_alpha26.sh

      - name: Upload validated Alpha26
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.26-realdata
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.26-realdata.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.26-realdata.sha256
            source/kifnex-preview/kifnex026-cert.txt
            source/kifnex-preview/kifnex026-badging.txt
            source/kifnex-preview/kifnex026-permissions.txt
            source/kifnex-preview/kifnex026-calculator-tests.txt
            source/kifnex-preview/kifnex026-bank-parser-tests.txt
            source/kifnex-preview/kifnex026-name-tests.txt
            source/kifnex-preview/kifnex026-bank-observation.png
            source/kifnex-preview/kifnex026.xml
            source/kifnex-preview/kifnex026-package.txt
            source/kifnex-preview/kifnex026-logcat.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish V2 status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" > kifnex026-v2-status.txt
          git add kifnex026-v2-status.txt
          git commit -m 'Publish KifNex Alpha26 V2 status' || true
          git push || true
