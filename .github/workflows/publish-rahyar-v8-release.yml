name: Publish RahYar 0.14.1 Field V8 Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'publish-rahyar-v8-release-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download successful Field V8 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Saeiddvc/RahYar-Alpha05-Open-Build/actions/artifacts/9593832558/zip > /tmp/rahyar-v8.zip
          mkdir -p /tmp/rahyar-v8
          unzip -q /tmp/rahyar-v8.zip -d /tmp/rahyar-v8
          APK=$(find /tmp/rahyar-v8 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ./RahYar-0.14.1-Field-V8.apk
          sha256sum RahYar-0.14.1-Field-V8.apk > RahYar-0.14.1-Field-V8.apk.sha256
          ls -lh RahYar-0.14.1-Field-V8.apk

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='rahyar-0.14.1-field-v8'
          NOTES='Field V8: precise high-confidence alley/current-position route origin; LHD/RHD driver cockpit with Iran default; speed HUD and destination card physically mirrored by driver side; ETA/remaining distance/end grouped; faster current-point automatic reroute; readable high-contrast off-route strip; hands-free RahYar wake commands; nearest fuel/POI merge; OSM maxspeed plus static speed-camera/traffic-calming/road-condition context; purple high-contrast mid-route leg; Picture-in-Picture navigation continuity during calls; Android Auto navigation service retained; native fa-IR voice service with embedded fallback; keep-screen-on.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'RahYar 0.14.1 Field V8' --notes "$NOTES"
          fi
          gh release upload "$TAG" RahYar-0.14.1-Field-V8.apk RahYar-0.14.1-Field-V8.apk.sha256 --clobber
