name: RahYar 0.14.1 Foundation Runtime Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0141-foundation-runtime-trigger.txt'

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-stabilization-0141

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate and compile foundation
        working-directory: source
        run: |
          set -euo pipefail
          python tools/stage_rahyar_0140_embedded_tts.py
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          python tools/stage_rahyar_0135_ci_typography.py
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py
          python tools/fix_rahyar_0137_feedback_state.py
          python tools/fix_rahyar_0137_feedback_save_gate.py
          python tools/apply_rahyar_0138a_surface.py
          python tools/apply_rahyar_0138b_motion.py
          python tools/apply_rahyar_0138c_free_drive.py
          python tools/apply_rahyar_0138d_weather.py
          python tools/apply_rahyar_0138e_gates.py
          python tools/apply_rahyar_0138f_widget_guard.py
          python tools/apply_rahyar_0138h_tts_restore.py
          python tools/apply_rahyar_0139_ui_behavior.py
          python tools/apply_rahyar_0140_embedded_tts.py
          python tools/apply_rahyar_0141_camera_theme.py
          python tools/apply_rahyar_0141_waypoint_weather.py
          grep -q 'versionName = "0.14.1-alpha-p0"' app/build.gradle.kts
          grep -q 'PASS HEADING_UP_DEFAULT' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'PASS COMPASS_CONTEXTUAL' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'PASS THEME_DARK_VISIBLE' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'v3-waypoint' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          gradle assembleDebug -x prepareRahYarSources --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RahYar-0.14.1-foundation-CI-NOT-RELEASE.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator plain launch plus simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          working-directory: source
          script: |
            adb wait-for-device
            adb install -r RahYar-0.14.1-foundation-CI-NOT-RELEASE.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity
            sleep 10
            adb shell pidof ir.rahyar.app | grep -q '[0-9]'
            echo PASS_PLAIN_LAUNCH_SURVIVES
            adb logcat -d > RahYar-0.14.1-plain-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*ir.rahyar.app|Fatal signal.*ir.rahyar.app' RahYar-0.14.1-plain-logcat.txt
            adb shell am force-stop ir.rahyar.app
            adb logcat -c
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            for i in $(seq 1 220); do adb logcat -d | grep -q 'RahYarSim.*COMPLETE' && break; sleep .25; done
            adb logcat -d > RahYar-0.14.1-foundation-logcat.txt
            grep RahYarSim RahYar-0.14.1-foundation-logcat.txt > RahYar-0.14.1-foundation-simulation.txt || true
            cat RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS HEADING_UP_DEFAULT' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS COMPASS_CONTEXTUAL' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS COMPASS_RESET_HEADING' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS THEME_DARK_VISIBLE' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS WEATHER_VERTICAL' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'PASS WEATHER_TAP_DISMISS' RahYar-0.14.1-foundation-simulation.txt
            grep -q 'COMPLETE' RahYar-0.14.1-foundation-simulation.txt
            ! grep -q 'FAIL' RahYar-0.14.1-foundation-simulation.txt
            adb shell pidof ir.rahyar.app | grep -q '[0-9]'
            ! grep -E 'FATAL EXCEPTION.*ir.rahyar.app|Fatal signal.*ir.rahyar.app' RahYar-0.14.1-foundation-logcat.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.14.1-foundation-runtime-CI-NOT-RELEASE
          path: |
            source/RahYar-0.14.1-foundation-CI-NOT-RELEASE.apk
            source/RahYar-0.14.1-plain-logcat.txt
            source/RahYar-0.14.1-foundation-logcat.txt
            source/RahYar-0.14.1-foundation-simulation.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nconclusion=%s\nstatus=completed\nupdated_at=%s\nartifact_name=%s\n' '${{ github.run_id }}' '${{ job.status }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'RahYar-0.14.1-foundation-runtime-CI-NOT-RELEASE' > /tmp/status.txt
          b64=$(base64 -w0 /tmp/status.txt); api="repos/${{ github.repository }}/contents/status/rahyar-0141-foundation-runtime.txt"; sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api --method PUT "$api" -f message='Update 0.14.1 foundation runtime status' -f content="$b64" -f sha="$sha" >/dev/null; else gh api --method PUT "$api" -f message='Add 0.14.1 foundation runtime status' -f content="$b64" >/dev/null; fi
