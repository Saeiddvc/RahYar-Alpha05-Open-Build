name: RahYar 0.13.7 Closeout Field Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0137-trigger.txt'

permissions:
  contents: read

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-p0-stability-0137

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare RahYar source through 0.13.4
        working-directory: source
        run: |
          set -euo pipefail
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py

      - name: Install exact approved IRANSans FaNum family
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' \
            -o app/src/main/assets/fonts/iransans_fanum_regular.ttf
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' \
            -o app/src/main/assets/fonts/iransans_fanum_medium.ttf
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' \
            -o app/src/main/assets/fonts/iransans_fanum_bold.ttf
          echo '1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9  app/src/main/assets/fonts/iransans_fanum_regular.ttf' | sha256sum -c -
          echo 'd8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0  app/src/main/assets/fonts/iransans_fanum_medium.ttf' | sha256sum -c -
          echo '96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19  app/src/main/assets/fonts/iransans_fanum_bold.ttf' | sha256sum -c -
          python tools/apply_rahyar_0135_iransans_font.py

      - name: Apply 0.13.6 navigation baseline and 0.13.7 field fixes
        working-directory: source
        run: |
          set -euo pipefail
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py

      - name: Gate requested field fixes before compile
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.13.7-alpha-p0"' app/build.gradle.kts
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'showReportMapEffect' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'REPORT_MAP_FEEDBACK' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'armNavigationPanelTapAway' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'OVERVIEW_MAP_TAP_DISMISS' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'POST_TRIP_FEEDBACK' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'attachPanelAboveDock(card,dp(204))' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'setCompassEnabled(true)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'confirmStopNavigation' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          test ! -e app/src/main/assets/fonts/b_traffic.ttf
          echo '1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9  app/src/main/assets/fonts/iransans_fanum_regular.ttf' | sha256sum -c -
          echo 'd8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0  app/src/main/assets/fonts/iransans_fanum_medium.ttf' | sha256sum -c -
          echo '96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19  app/src/main/assets/fonts/iransans_fanum_bold.ttf' | sha256sum -c -

      - name: Compile APK
        working-directory: source
        run: gradle assembleDebug -x prepareRahYarSources --stacktrace

      - name: Align and sign field APK with v1 v2 v3
        working-directory: source
        run: |
          set -euo pipefail
          RAW=app/build/outputs/apk/debug/app-debug.apk
          test -s "$RAW"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          cp "$RAW" rahyar-unsigned-work.apk
          zip -d rahyar-unsigned-work.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' >/dev/null 2>&1 || true
          "$ZIPALIGN" -P 16 -f 4 rahyar-unsigned-work.apk RahYar-0.13.7-alpha-p0-aligned.apk
          keytool -genkeypair -noprompt -keystore rahyar-field-test.jks -storepass rahyar0137 -keypass rahyar0137 \
            -alias rahyarfield -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=RahYar Field Test, OU=QA, O=RahYar, L=Tehran, C=IR'
          "$APKSIGNER" sign --ks rahyar-field-test.jks --ks-key-alias rahyarfield \
            --ks-pass pass:rahyar0137 --key-pass pass:rahyar0137 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out RahYar-0.13.7-alpha-p0.apk RahYar-0.13.7-alpha-p0-aligned.apk
          "$ZIPALIGN" -P 16 -c -v 4 RahYar-0.13.7-alpha-p0.apk > RahYar-0.13.7-alignment.txt
          "$APKSIGNER" verify --verbose --print-certs RahYar-0.13.7-alpha-p0.apk > RahYar-0.13.7-signing.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' RahYar-0.13.7-signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' RahYar-0.13.7-signing.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' RahYar-0.13.7-signing.txt
          sha256sum RahYar-0.13.7-alpha-p0.apk > RahYar-0.13.7-alpha-p0.sha256

      - name: Verify APK identity and embedded fonts
        working-directory: source
        run: |
          set -euo pipefail
          APK=RahYar-0.13.7-alpha-p0.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > rahyar-badging.txt
          grep -q "package: name='ir.rahyar.app'" rahyar-badging.txt
          grep -q "application-label:'راه‌یار'" rahyar-badging.txt
          grep -q 'versionName=.0.13.7-alpha-p0.' rahyar-badging.txt
          unzip -l "$APK" > rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_regular.ttf' rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_medium.ttf' rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_bold.ttf' rahyar-apk-files.txt
          ! grep -q 'assets/fonts/b_traffic.ttf' rahyar-apk-files.txt
          unzip -p "$APK" assets/fonts/iransans_fanum_regular.ttf > extracted-iransans-regular.ttf
          unzip -p "$APK" assets/fonts/iransans_fanum_medium.ttf > extracted-iransans-medium.ttf
          unzip -p "$APK" assets/fonts/iransans_fanum_bold.ttf > extracted-iransans-bold.ttf
          echo '1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9  extracted-iransans-regular.ttf' | sha256sum -c -
          echo 'd8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0  extracted-iransans-medium.ttf' | sha256sum -c -
          echo '96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19  extracted-iransans-bold.ttf' | sha256sum -c -

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate field regressions and full journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source
          script: |
            set -eu
            adb install -r RahYar-0.13.7-alpha-p0.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            sleep 11
            adb exec-out screencap -p > RahYar-0.13.7-feedback-screen.png || true
            sleep 9
            adb logcat -d > RahYar-0.13.7-logcat.txt || true
            grep RahYarSim RahYar-0.13.7-logcat.txt > RahYar-0.13.7-simulation.txt || true
            adb shell dumpsys activity activities > RahYar-0.13.7-activities.txt || true
            adb exec-out screencap -p > RahYar-0.13.7-final-screen.png || true
            cat RahYar-0.13.7-simulation.txt
            test -n "$(adb shell pidof ir.rahyar.app)"
            grep -q 'PASS HOME' RahYar-0.13.7-simulation.txt
            grep -q 'PASS SEARCH' RahYar-0.13.7-simulation.txt
            grep -q 'PASS ROUTE_PREVIEW' RahYar-0.13.7-simulation.txt
            grep -q 'PASS NAVIGATION' RahYar-0.13.7-simulation.txt
            grep -q 'PASS HEADING_ROUTE_ALIGNED' RahYar-0.13.7-simulation.txt
            grep -q 'PASS REPORT_MENU' RahYar-0.13.7-simulation.txt
            grep -q 'PASS REPORT_MAP_FEEDBACK' RahYar-0.13.7-simulation.txt
            grep -q 'PASS OVERVIEW' RahYar-0.13.7-simulation.txt
            grep -q 'PASS OVERVIEW_MAP_TAP_DISMISS' RahYar-0.13.7-simulation.txt
            grep -q 'PASS STOP_CONTROL' RahYar-0.13.7-simulation.txt
            grep -q 'PASS POST_TRIP_FEEDBACK' RahYar-0.13.7-simulation.txt
            grep -q 'PASS FEEDBACK_SAVE' RahYar-0.13.7-simulation.txt
            grep -q 'COMPLETE' RahYar-0.13.7-simulation.txt
            grep -q 'PASS OFFLINE_ACTIVITY' RahYar-0.13.7-simulation.txt
            ! grep -q 'FAIL' RahYar-0.13.7-simulation.txt
            ! grep -q 'FATAL EXCEPTION.*ir.rahyar.app' RahYar-0.13.7-logcat.txt

      - name: Write validation summary
        if: success()
        working-directory: source
        run: |
          cat > Validation-0.13.7.txt <<'EOF'
          RahYar 0.13.7 Alpha P0 - Field Validation
          ==========================================
          Package: ir.rahyar.app
          Version: 0.13.7-alpha-p0 / versionCode 34
          Field fixes gated: report map feedback, map-tap overlay dismissal, map-dominant overview, post-trip feedback after manual stop.
          Navigation baseline gated: route-aligned heading, compass, stop control, waypoint, overview, offline maps.
          Typography: exact IRANSans FaNum Regular / Medium / Bold; B Traffic absent.
          Signing: v1 / v2 / v3 required by workflow.
          Alignment: zipalign -P 16 verified.
          Device note: heading behavior still requires a real moving GNSS field check.
          Install note: locally generated field-test signing certificate; uninstall builds signed by another key before installation.
          EOF
          cat RahYar-0.13.7-alpha-p0.sha256 >> Validation-0.13.7.txt

      - name: Upload RahYar 0.13.7 final field artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.13.7-alpha-p0-closeout-final
          path: |
            source/RahYar-0.13.7-alpha-p0.apk
            source/RahYar-0.13.7-alpha-p0.sha256
            source/Validation-0.13.7.txt
            source/RahYar-0.13.7-signing.txt
            source/RahYar-0.13.7-alignment.txt
            source/rahyar-badging.txt
            source/rahyar-apk-files.txt
            source/RahYar-0.13.7-simulation.txt
            source/RahYar-0.13.7-logcat.txt
            source/RahYar-0.13.7-activities.txt
            source/RahYar-0.13.7-feedback-screen.png
            source/RahYar-0.13.7-final-screen.png
          if-no-files-found: warn
          retention-days: 14
