name: KifNex 0.1.0-alpha.22 Final Validation v5

on:
  push:
    paths:
      - 'kifnex022e-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REF: kifnex-alpha22-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: buildrepo
      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare source and stable signing
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          python3 patch_alpha21.py
          python3 patch_alpha22.py
          python3 patch_alpha22b.py
          openssl pkcs12 -export -inkey kifnex-alpha-test-key.pem -in kifnex-alpha-test-cert.pem -name kifnex-alpha -out kifnex-alpha-test.p12 -passout pass:kifnexAlpha2026
          rm -f app/kifnex-alpha-test.keystore
          keytool -importkeystore -srckeystore kifnex-alpha-test.p12 -srcstoretype PKCS12 -srcstorepass kifnexAlpha2026 -srcalias kifnex-alpha -destkeystore app/kifnex-alpha-test.keystore -deststoretype JKS -deststorepass kifnexAlpha2026 -destkeypass kifnexAlpha2026 -destalias kifnex-alpha -noprompt
          keytool -list -keystore app/kifnex-alpha-test.keystore -storepass kifnexAlpha2026 -alias kifnex-alpha
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf
      - name: Build APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
          sha256sum KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > kifnex022-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex022-badging.txt
          grep -q "versionName='0.1.0-alpha.22'" kifnex022-badging.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > kifnex022-cert.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -eu
            adb install -r KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
            adb shell pm clear ir.kifnex.app
            adb shell am start -n ir.kifnex.app/.MainActivity --ez kifnex_test_registered true
            sleep 4
            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml home.xml >/dev/null
            grep -q 'قدرت خرید کل' home.xml

            # Drill-down from chart lower trend region.
            python3 - <<'PY' > tap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('home.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='تحلیل':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
            PY
            read x y < tap.txt; adb shell input tap "$x" "$y"; sleep 2
            adb shell uiautomator dump /sdcard/analytics.xml >/dev/null
            adb pull /sdcard/analytics.xml analytics.xml >/dev/null
            grep -q 'نمودار تحلیلی تعاملی' analytics.xml
            adb exec-out screencap -p > kifnex022-analytics.png
            python3 - <<'PY' > chart.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('analytics.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('content-desc')=='نمودار تحلیلی تعاملی':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());print((a+c)//2,int(b+(d-b)*.76));break
            PY
            read x y < chart.txt; adb shell input tap "$x" "$y"; sleep 2
            adb shell uiautomator dump /sdcard/drill.xml >/dev/null
            adb pull /sdcard/drill.xml drill.xml >/dev/null
            grep -q 'جزئیات' drill.xml
            adb exec-out screencap -p > kifnex022-drill.png
            adb shell input keyevent 4; sleep 1

            # Return home and open payment flow.
            adb shell uiautomator dump /sdcard/current.xml >/dev/null
            adb pull /sdcard/current.xml current.xml >/dev/null
            python3 - <<'PY' > homeTap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('current.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='خانه':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
            PY
            read x y < homeTap.txt; adb shell input tap "$x" "$y"; sleep 1
            adb shell uiautomator dump /sdcard/home2.xml >/dev/null; adb pull /sdcard/home2.xml home2.xml >/dev/null
            python3 - <<'PY' > payTap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('home2.xml').getroot()
            hits=[]
            for n in root.iter('node'):
                if n.attrib.get('text')=='پرداخت':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());hits.append(((a+c)//2,(b+d)//2,b))
            hits.sort(key=lambda x:x[2]);print(hits[0][0],hits[0][1])
            PY
            read x y < payTap.txt; adb shell input tap "$x" "$y"; sleep 1
            adb shell uiautomator dump /sdcard/pay.xml >/dev/null; adb pull /sdcard/pay.xml pay.xml >/dev/null
            python3 - <<'PY' > amountTap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('pay.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='مبلغ به تومان':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
            PY
            read x y < amountTap.txt; adb shell input tap "$x" "$y"; adb shell input text 10000; sleep 1
            adb shell uiautomator dump /sdcard/pay2.xml >/dev/null; adb pull /sdcard/pay2.xml pay2.xml >/dev/null
            python3 - <<'PY' > continueTap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('pay2.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='بررسی و ادامه':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);a,b,c,d=map(int,m.groups());print((a+c)//2,(b+d)//2);break
            PY
            read x y < continueTap.txt; adb shell input tap "$x" "$y"; sleep 2
            adb shell uiautomator dump /sdcard/confirm.xml >/dev/null; adb pull /sdcard/confirm.xml confirm.xml >/dev/null
            grep -q 'تأیید و ادامه' confirm.xml
            grep -q 'انصراف' confirm.xml
            adb exec-out screencap -p > kifnex022-confirm-bottom.png

            adb logcat -d > kifnex022-logcat.txt
            test -n "$(adb shell pidof ir.kifnex.app)"
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex022-logcat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.sha256
            source/kifnex-preview/kifnex022-cert.txt
            source/kifnex-preview/kifnex022-badging.txt
            source/kifnex-preview/kifnex022-analytics.png
            source/kifnex-preview/kifnex022-drill.png
            source/kifnex-preview/kifnex022-confirm-bottom.png
            source/kifnex-preview/kifnex022-logcat.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" > kifnex022e-status.txt
          git add kifnex022e-status.txt
          git commit -m 'Publish KifNex Alpha22 v5 status' || true
          git push || true
