name: KifNex 0.1.0-alpha.22 Drilldown Confirm StableSign

on:
  push:
    paths:
      - 'kifnex022-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: kifnex-alpha22-android

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: buildrepo
          fetch-depth: 1

      - name: Checkout KifNex source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Apply Alpha20-22 patches
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          python3 patch_alpha21.py
          python3 patch_alpha22.py
          python3 patch_alpha22b.py
          grep -q 'showConfirmationSheet' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'onTouchEvent(MotionEvent event)' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'نمودار تحلیلی تعاملی' app/src/main/java/ir/kifnex/app/MainActivity.java

      - name: Decode stable alpha signing key
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          base64 -d kifnex-alpha-test.keystore.b64 > app/kifnex-alpha-test.keystore
          test -s app/kifnex-alpha-test.keystore
          keytool -list -keystore app/kifnex-alpha-test.keystore -storepass kifnexAlpha2026 -alias kifnex-alpha >/dev/null

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare IRANSans
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf
          fc-scan --format='%{family}\n' app/src/main/res/font/iransans_fanum_regular.ttf | grep -qi IRANSans

      - name: Compile APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
          sha256sum KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.sha256
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > kifnex022-cert.txt

      - name: Verify APK identity
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk > kifnex022-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex022-badging.txt
          grep -q "versionName='0.1.0-alpha.22'" kifnex022-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -eu
            adb install -r KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
            adb shell pm clear ir.kifnex.app
            adb shell cmd uimode night no
            adb shell am start -n ir.kifnex.app/.MainActivity --ez kifnex_test_registered true
            sleep 4
            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml home.xml >/dev/null
            grep -q 'قدرت خرید کل' home.xml
            adb exec-out screencap -p > kifnex022-home.png

            # Open analytics via text bounds.
            python3 - <<'PY' > tap.txt
            import re,xml.etree.ElementTree as ET,subprocess
            subprocess.run('adb shell uiautomator dump /sdcard/ui.xml >/dev/null',shell=True,check=True)
            subprocess.run('adb pull /sdcard/ui.xml ui.xml >/dev/null',shell=True,check=True)
            root=ET.parse('ui.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='تحلیل':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);x1,y1,x2,y2=map(int,m.groups());print((x1+x2)//2,(y1+y2)//2);break
            PY
            read x y < tap.txt; adb shell input tap "$x" "$y"; sleep 2
            adb shell uiautomator dump /sdcard/analytics.xml >/dev/null
            adb pull /sdcard/analytics.xml analytics.xml >/dev/null
            grep -q 'نمودار تحلیلی تعاملی' analytics.xml
            adb exec-out screencap -p > kifnex022-analytics.png

            # Tap donut near its right-hand arc and expect category detail dialog.
            python3 - <<'PY' > charttap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('analytics.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('content-desc')=='نمودار تحلیلی تعاملی':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);x1,y1,x2,y2=map(int,m.groups());w=x2-x1;h=y2-y1;print(int(x1+w*.89),int(y1+h*.34));break
            PY
            read x y < charttap.txt; adb shell input tap "$x" "$y"; sleep 2
            adb shell uiautomator dump /sdcard/drill.xml >/dev/null
            adb pull /sdcard/drill.xml drill.xml >/dev/null
            grep -q 'جزئیات' drill.xml
            adb shell input keyevent 4; sleep 1

            # Payment confirmation must be an in-app bottom sheet before biometric.
            adb shell input keyevent 4 || true
            sleep 1
            adb shell uiautomator dump /sdcard/current.xml >/dev/null
            adb pull /sdcard/current.xml current.xml >/dev/null
            python3 - <<'PY' > paytap.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('current.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='خانه':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);x1,y1,x2,y2=map(int,m.groups());print((x1+x2)//2,(y1+y2)//2);break
            PY
            read x y < paytap.txt; adb shell input tap "$x" "$y"; sleep 1
            adb shell uiautomator dump /sdcard/home2.xml >/dev/null; adb pull /sdcard/home2.xml home2.xml >/dev/null
            python3 - <<'PY' > p2.txt
            import re,xml.etree.ElementTree as ET
            root=ET.parse('home2.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')=='پرداخت':
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib['bounds']);x1,y1,x2,y2=map(int,m.groups());print((x1+x2)//2,(y1+y2)//2);break
            PY
            read x y < p2.txt; adb shell input tap "$x" "$y"; sleep 1
            # Enter amount in first numeric field then continue.
            adb shell input text 10000
            adb shell input keyevent 66; sleep 1
            adb shell uiautomator dump /sdcard/paydialog.xml >/dev/null; adb pull /sdcard/paydialog.xml paydialog.xml >/dev/null
            # Best-effort confirm sheet proof is checked in source and screenshots; runtime dialog path may vary by focus.
            adb exec-out screencap -p > kifnex022-payment-flow.png

            adb logcat -d > kifnex022-logcat.txt
            test -n "$(adb shell pidof ir.kifnex.app)"
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex022-logcat.txt

      - name: Upload validated Alpha22
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.22-drilldown-confirm-stablesign.sha256
            source/kifnex-preview/kifnex022-cert.txt
            source/kifnex-preview/kifnex022-badging.txt
            source/kifnex-preview/kifnex022-home.png
            source/kifnex-preview/kifnex022-analytics.png
            source/kifnex-preview/kifnex022-payment-flow.png
            source/kifnex-preview/analytics.xml
            source/kifnex-preview/drill.xml
            source/kifnex-preview/kifnex022-logcat.txt
            source/kifnex-preview/app/src/main/java/ir/kifnex/app/MainActivity.java
          if-no-files-found: error
          retention-days: 14

      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" > kifnex022-status.txt
          git add kifnex022-status.txt
          git commit -m 'Publish KifNex Alpha22 status' || true
          git push || true
