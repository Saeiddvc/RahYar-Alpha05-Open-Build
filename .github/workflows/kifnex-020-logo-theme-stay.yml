name: KifNex 0.1.0-alpha.20 Logo Theme Stay

on:
  push:
    paths:
      - 'kifnex020-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: kifnex-alpha20-android

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build-status repository
        uses: actions/checkout@v4
        with:
          path: buildrepo
          fetch-depth: 1

      - name: Require private source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Apply Alpha20 UI fixes
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          grep -q 'private void showAppearancePage' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'drawFinancialNode' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'selectThemeMode' app/src/main/java/ir/kifnex/app/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare IRANSans
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf
          fc-scan --format='%{family}\n' app/src/main/res/font/iransans_fanum_regular.ttf | grep -qi IRANSans

      - name: Compile APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.20-logo-theme-stay.apk
          sha256sum KifNex-0.1.0-alpha.20-logo-theme-stay.apk > KifNex-0.1.0-alpha.20-logo-theme-stay.sha256

      - name: Verify identity
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.20-logo-theme-stay.apk > kifnex020-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex020-badging.txt
          grep -q "versionName='0.1.0-alpha.20'" kifnex020-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime theme navigation and logo smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -euo pipefail
            adb install -r KifNex-0.1.0-alpha.20-logo-theme-stay.apk
            adb shell pm clear ir.kifnex.app
            adb shell cmd uimode night no
            adb shell am start -n ir.kifnex.app/.MainActivity --ez kifnex_test_registered true
            sleep 4
            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml home.xml >/dev/null
            grep -q 'قدرت خرید کل' home.xml
            adb exec-out screencap -p > kifnex020-home-light.png

            tap_text() {
              local text="$1"
              adb shell uiautomator dump /sdcard/current.xml >/dev/null
              adb pull /sdcard/current.xml current.xml >/dev/null
              python3 - "$text" <<'PY' > tap.txt
            import re,sys,xml.etree.ElementTree as ET
            text=sys.argv[1]
            root=ET.parse('current.xml').getroot()
            for n in root.iter('node'):
                if n.attrib.get('text')==text:
                    b=n.attrib.get('bounds','')
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',b)
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        print((x1+x2)//2,(y1+y2)//2)
                        raise SystemExit
            raise SystemExit('text not found: '+text)
            PY
              read x y < tap.txt
              adb shell input tap "$x" "$y"
              sleep 2
            }

            tap_text 'بیشتر'
            tap_text 'ظاهر'
            adb shell uiautomator dump /sdcard/appearance.xml >/dev/null
            adb pull /sdcard/appearance.xml appearance.xml >/dev/null
            grep -q 'ظاهر برنامه' appearance.xml
            adb exec-out screencap -p > kifnex020-appearance-system.png

            tap_text 'تیره'
            adb shell uiautomator dump /sdcard/after-dark.xml >/dev/null
            adb pull /sdcard/after-dark.xml after-dark.xml >/dev/null
            grep -q 'ظاهر برنامه' after-dark.xml
            grep -q 'حالت نمایش را انتخاب کنید' after-dark.xml
            adb exec-out screencap -p > kifnex020-appearance-dark.png

            tap_text 'روشن'
            adb shell uiautomator dump /sdcard/after-light.xml >/dev/null
            adb pull /sdcard/after-light.xml after-light.xml >/dev/null
            grep -q 'ظاهر برنامه' after-light.xml
            grep -q 'حالت نمایش را انتخاب کنید' after-light.xml
            adb exec-out screencap -p > kifnex020-appearance-light.png

            adb logcat -d > kifnex020-logcat.txt
            test -n "$(adb shell pidof ir.kifnex.app)"
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex020-logcat.txt

      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.20-logo-theme-stay
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.20-logo-theme-stay.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.20-logo-theme-stay.sha256
            source/kifnex-preview/kifnex020-badging.txt
            source/kifnex-preview/kifnex020-home-light.png
            source/kifnex-preview/kifnex020-appearance-system.png
            source/kifnex-preview/kifnex020-appearance-dark.png
            source/kifnex-preview/kifnex020-appearance-light.png
            source/kifnex-preview/appearance.xml
            source/kifnex-preview/after-dark.xml
            source/kifnex-preview/after-light.xml
            source/kifnex-preview/kifnex020-logcat.txt
            source/kifnex-preview/app/src/main/java/ir/kifnex/app/MainActivity.java
          if-no-files-found: error
          retention-days: 14

      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          cat > kifnex020-status.txt <<EOF
          status=${JOB_STATUS}
          run_id=${GITHUB_RUN_ID}
          source_ref=${SOURCE_REF}
          updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add kifnex020-status.txt
          git commit -m 'Publish KifNex Alpha20 status' || true
          git push || true
