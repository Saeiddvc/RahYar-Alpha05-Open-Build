name: KifNex 0.1.0-alpha.21 Functional Wallet

on:
  push:
    paths:
      - 'kifnex021-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: kifnex-alpha21-android

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: buildrepo
          fetch-depth: 1

      - name: Checkout KifNex source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Apply UI and functional patches
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          python3 patch_alpha21.py
          grep -q 'showCreatePocketDialog' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'showSecurityPage' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'authorizeSensitive' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'showServiceFlow' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'drawFinancialNode' app/src/main/java/ir/kifnex/app/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare IRANSans
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf
          fc-scan --format='%{family}\n' app/src/main/res/font/iransans_fanum_regular.ttf | grep -qi IRANSans

      - name: Compile APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.21-functional-wallet.apk
          sha256sum KifNex-0.1.0-alpha.21-functional-wallet.apk > KifNex-0.1.0-alpha.21-functional-wallet.sha256

      - name: Verify APK identity
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.21-functional-wallet.apk > kifnex021-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex021-badging.txt
          grep -q "versionName='0.1.0-alpha.21'" kifnex021-badging.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -eu
            adb install -r KifNex-0.1.0-alpha.21-functional-wallet.apk
            adb shell pm clear ir.kifnex.app
            adb shell cmd uimode night no
            adb shell am start -n ir.kifnex.app/.MainActivity --ez kifnex_test_registered true
            sleep 4
            adb shell uiautomator dump /sdcard/home.xml >/dev/null
            adb pull /sdcard/home.xml kifnex021-home.xml >/dev/null
            grep -q 'قدرت خرید کل' kifnex021-home.xml
            grep -q 'منابع من' kifnex021-home.xml
            adb exec-out screencap -p > kifnex021-home-light.png
            adb shell input tap 870 2245
            sleep 2
            adb shell uiautomator dump /sdcard/wallets.xml >/dev/null
            adb pull /sdcard/wallets.xml kifnex021-wallets.xml >/dev/null
            grep -q 'جیب‌های هدف' kifnex021-wallets.xml
            grep -q 'ساخت جیب جدید' kifnex021-wallets.xml
            adb exec-out screencap -p > kifnex021-wallets-light.png
            adb shell cmd uimode night yes
            adb shell am force-stop ir.kifnex.app
            adb shell am start -n ir.kifnex.app/.MainActivity
            sleep 3
            adb exec-out screencap -p > kifnex021-home-dark.png
            adb logcat -d > kifnex021-logcat.txt
            test -n "$(adb shell pidof ir.kifnex.app)"
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex021-logcat.txt

      - name: Upload validated Alpha21
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.21-functional-wallet
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.21-functional-wallet.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.21-functional-wallet.sha256
            source/kifnex-preview/kifnex021-badging.txt
            source/kifnex-preview/kifnex021-home-light.png
            source/kifnex-preview/kifnex021-wallets-light.png
            source/kifnex-preview/kifnex021-home-dark.png
            source/kifnex-preview/kifnex021-home.xml
            source/kifnex-preview/kifnex021-wallets.xml
            source/kifnex-preview/kifnex021-logcat.txt
            source/kifnex-preview/app/src/main/java/ir/kifnex/app/MainActivity.java
            source/kifnex-preview/app/src/main/java/ir/kifnex/app/KifNexData.java
          if-no-files-found: error
          retention-days: 14

      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" > kifnex021-status.txt
          git add kifnex021-status.txt
          git commit -m 'Publish KifNex Alpha21 status' || true
          git push || true
