name: RahYar Alpha05 Open — Real App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require private RahYar source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "Missing repository secret RAHYAR_SOURCE_TOKEN"
            exit 1
          fi

      - name: Checkout real RahYar source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: main
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          persist-credentials: false
          path: rahyar

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Alpha05 Open version
        working-directory: rahyar
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/setZoomControlsEnabled(false);/d' app/src/main/java/ir/rahyar/app/MainActivity.java
          sed -i '/CameraUpdateFactory.scrollBy(distanceX, distanceY)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppService.java
          sed -i '/CameraUpdateFactory.scrollBy(dx,dy)/d' app/src/main/java/ir/rahyar/app/RahYarCarAppServiceRC.java
          sed -i 's/@Override public void onScroll(float dx,float dy){if(map!=null)map.moveCamera(CameraUpdateFactory.scrollBy(dx,dy));}/@Override public void onScroll(float dx,float dy){ }/' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java
          sed -i 's/RahYarV1Activity.AmbientView a=null;//' app/src/main/java/ir/rahyar/app/RahYarV2Activity.java
          sed -i 's/versionCode = 26/versionCode = 105/' app/build.gradle.kts
          sed -i 's/versionName = "0.12.0-rc1"/versionName = "0.11.0-alpha05-open"/' app/build.gradle.kts

      - name: Gate — this must be RahYar, not Organic Maps
        working-directory: rahyar
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'android:name=".RahYarV3Activity"' app/src/main/AndroidManifest.xml
          grep -q 'android:label="راه‌یار"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "ir.rahyar.app"' app/build.gradle.kts
          grep -q 'org.maplibre.gl:android-sdk-opengl' app/build.gradle.kts
          grep -q 'class RahYarV3Activity' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'کجا می‌خوای بری؟' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'router.project-osrm.org' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          grep -q 'api.open-meteo.com' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          grep -q 'nominatim.openstreetmap.org' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          if grep -R -q 'com.google.android.libraries.navigation' app build.gradle.kts settings.gradle.kts; then
            echo 'Google Navigation SDK found — refusing build'; exit 1
          fi
          if grep -R -q 'app.organicmaps\|org.organicmaps' app/src/main app/build.gradle.kts; then
            echo 'Organic Maps application code found — refusing build'; exit 1
          fi

      - name: Unit tests
        working-directory: rahyar
        run: gradle testDebugUnitTest --stacktrace

      - name: Build real RahYar APK
        working-directory: rahyar
        run: gradle assembleDebug --stacktrace

      - name: Verify built APK identity
        working-directory: rahyar
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > apk-badging.txt
          cat apk-badging.txt | head -20
          grep -q "package: name='ir.rahyar.app'" apk-badging.txt
          grep -q "launchable-activity: name='ir.rahyar.app.RahYarV3Activity'" apk-badging.txt

      - name: Prepare verified deliverables
        working-directory: rahyar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/RahYar-0.11.0-alpha05-open.apk
          sha256sum out/RahYar-0.11.0-alpha05-open.apk > out/RahYar-0.11.0-alpha05-open.sha256
          cp apk-badging.txt out/apk-badging.txt
          cat > out/README.txt <<'EOF'
          RahYar 0.11.0 Alpha05 Open
          Built from the real private RahYar Android application source.
          Launcher: ir.rahyar.app.RahYarV3Activity
          UI: RahYar map-first Persian product surface.
          Map: MapLibre / open map style.
          Search: Nominatim field endpoint.
          Routing: OSRM field endpoint.
          Weather: Open-Meteo.
          Google Navigation SDK: prohibited by build gate.
          Organic Maps application UI/code: prohibited by build gate.
          EOF

      - name: Upload verified RahYar Alpha05 Open
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-alpha05-open-real-app
          path: rahyar/out/*
          if-no-files-found: error
          retention-days: 30
