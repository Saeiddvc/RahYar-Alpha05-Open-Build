name: RahYar 0.13.7 Gate Status Publisher

on:
  workflow_run:
    workflows: ["RahYar 0.13.7 Functional Field Gate v6"]
    types: [completed]

permissions:
  contents: write

env:
  STATUS_FILE: status/rahyar-0137-functional-v6.txt

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish completed gate identity
        run: |
          set -euo pipefail
          mkdir -p status
          cat > "$STATUS_FILE" <<EOF
          run_id=${{ github.event.workflow_run.id }}
          run_number=${{ github.event.workflow_run.run_number }}
          conclusion=${{ github.event.workflow_run.conclusion }}
          status=${{ github.event.workflow_run.status }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          updated_at=${{ github.event.workflow_run.updated_at }}
          artifact_name=RahYar-0.13.7-alpha-p0-functional-v6
          EOF
          git config user.name 'RahYar CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git add "$STATUS_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish RahYar 0.13.7 functional gate status"
          git push
