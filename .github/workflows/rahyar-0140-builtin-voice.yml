name: RahYar 0.14.0 Built-in Persian Voice

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0140-voice-trigger.txt'

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-p0-voice-0140

jobs:
  builtin-persian-voice-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate 0.14.0 source and bundled voice
        working-directory: source
        run: |
          set -euo pipefail
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          python tools/stage_rahyar_0135_ci_typography.py
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py
          python tools/fix_rahyar_0137_feedback_state.py
          python tools/fix_rahyar_0137_feedback_save_gate.py
          python tools/apply_rahyar_0138a_surface.py
          python tools/apply_rahyar_0138b_motion.py
          python tools/apply_rahyar_0138c_free_drive.py
          python tools/apply_rahyar_0138d_weather.py
          python tools/apply_rahyar_0138e_gates.py
          python tools/apply_rahyar_0138f_widget_guard.py
          python tools/apply_rahyar_0138h_tts_restore.py
          python tools/apply_rahyar_0139_ui_behavior.py
          python tools/apply_rahyar_0140_builtin_voice.py
          python tools/stage_rahyar_0140_persian_voice.py

      - name: Source and model gates
        working-directory: source
        run: |
          set -euo pipefail
          V3=app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          MODEL=app/src/main/assets/rahyar_tts/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx
          grep -q 'versionName = "0.14.0-alpha-p0"' app/build.gradle.kts
          grep -q 'versionCode = 37' app/build.gradle.kts
          grep -q 'com.github.k2-fsa:sherpa-onnx:v1.13.4' app/build.gradle.kts
          grep -q 'RahYarPersianVoice voice' "$V3"
          grep -q 'PASS BUILTIN_PERSIAN_TTS' "$V3"
          grep -q 'Gravity.RIGHT|Gravity.CENTER_VERTICAL' "$V3"
          grep -q 'داخلی · آفلاین · بدون نصب افزونه' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java
          ! grep -q 'TextToSpeech' "$V3"
          ! grep -q 'LANG_MISSING_DATA' "$V3"
          ! grep -q 'LANG_NOT_SUPPORTED' "$V3"
          ! grep -q 'صدای فارسی روی موتور گفتار دستگاه نصب نیست' "$V3"
          test -s "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 60000000
          echo '5a832803df099857d92cf7ec1e340c7ef6910433f089d9aca9ff1ebf9b7fa6c5  '"$MODEL" | sha256sum -c -
          grep -q 'external_voice_pack_required=false' app/src/main/assets/rahyar_tts/VOICE_MANIFEST.txt
          test -d app/src/main/assets/rahyar_tts/vits-piper-fa_IR-amir-medium/espeak-ng-data
          test -s app/src/main/assets/rahyar_tts/vits-piper-fa_IR-amir-medium/tokens.txt
          test ! -e app/src/main/assets/fonts/b_traffic.ttf

      - name: Compile, align and sign alpha candidate
        working-directory: source
        run: |
          set -euo pipefail
          gradle assembleDebug -x prepareRahYarSources --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk unsigned.apk
          zip -d unsigned.apk 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/*.MF' >/dev/null 2>&1 || true
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -P 16 -f 4 unsigned.apk aligned.apk
          # Temporary alpha signer only. A fixed release signer must come from GitHub Actions secrets.
          keytool -genkeypair -noprompt -keystore alpha-0140.jks -storepass rahyar0140 -keypass rahyar0140 -alias alpha -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=RahYar 0.14.0 Alpha, OU=QA, O=RahYar, L=Tehran, C=IR'
          "$BT/apksigner" sign --ks alpha-0140.jks --ks-key-alias alpha --ks-pass pass:rahyar0140 --key-pass pass:rahyar0140 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out RahYar-0.14.0-alpha-p0-builtin-voice.apk aligned.apk
          "$BT/apksigner" verify --verbose --print-certs RahYar-0.14.0-alpha-p0-builtin-voice.apk > RahYar-0.14.0-signing.txt
          "$BT/zipalign" -P 16 -c -v 4 RahYar-0.14.0-alpha-p0-builtin-voice.apk > RahYar-0.14.0-alignment.txt
          sha256sum RahYar-0.14.0-alpha-p0-builtin-voice.apk > RahYar-0.14.0.sha256
          unzip -l RahYar-0.14.0-alpha-p0-builtin-voice.apk | grep -q 'assets/rahyar_tts/vits-piper-fa_IR-amir-medium/fa_IR-amir-medium.onnx'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator built-in Persian voice and regression gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          working-directory: source
          script: |
            adb wait-for-device
            adb install -r RahYar-0.14.0-alpha-p0-builtin-voice.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            for i in $(seq 1 300); do adb logcat -d | grep -q 'PASS BUILTIN_PERSIAN_TTS' && break; sleep .4; done
            adb logcat -d | grep -q 'PASS BUILTIN_PERSIAN_TTS'
            for i in $(seq 1 220); do adb logcat -d | grep -q 'COMPLETE' && break; sleep .2; done
            adb logcat -d > RahYar-0.14.0-logcat.txt
            grep RahYarSim RahYar-0.14.0-logcat.txt > RahYar-0.14.0-simulation.txt || true
            cat RahYar-0.14.0-simulation.txt
            grep -q 'PASS BUILTIN_PERSIAN_TTS' RahYar-0.14.0-simulation.txt
            grep -q 'PASS FREE_DRIVE_UI' RahYar-0.14.0-simulation.txt
            grep -q 'PASS NAVIGATION' RahYar-0.14.0-simulation.txt
            grep -q 'PASS HEADING_ROUTE_ALIGNED' RahYar-0.14.0-simulation.txt
            grep -q 'PASS NAV_WEATHER_VISIBLE' RahYar-0.14.0-simulation.txt
            grep -q 'PASS COMPASS_VISIBLE' RahYar-0.14.0-simulation.txt
            grep -q 'PASS SUN_TIMES_VISIBLE' RahYar-0.14.0-simulation.txt
            grep -q 'PASS WEATHER_TAP_DISMISS' RahYar-0.14.0-simulation.txt
            grep -q 'PASS THEME_DARK_APPLIED' RahYar-0.14.0-simulation.txt
            grep -q 'PASS REPORT_MAP_FEEDBACK' RahYar-0.14.0-simulation.txt
            grep -q 'PASS OVERVIEW_COMPACT' RahYar-0.14.0-simulation.txt
            grep -q 'PASS OVERVIEW_MAP_TAP_DISMISS' RahYar-0.14.0-simulation.txt
            grep -q 'PASS STOP_CONTROL' RahYar-0.14.0-simulation.txt
            grep -q 'PASS POST_TRIP_FEEDBACK' RahYar-0.14.0-simulation.txt
            grep -q 'PASS FEEDBACK_SAVE' RahYar-0.14.0-simulation.txt
            grep -q 'PASS OFFLINE_ACTIVITY' RahYar-0.14.0-simulation.txt
            grep -q 'COMPLETE' RahYar-0.14.0-simulation.txt
            ! grep -q 'FAIL' RahYar-0.14.0-simulation.txt
            ! grep -q 'FATAL EXCEPTION.*ir.rahyar.app' RahYar-0.14.0-logcat.txt
            ! grep -q 'صدای فارسی روی موتور گفتار دستگاه نصب نیست' RahYar-0.14.0-logcat.txt
            test -n "$(adb shell pidof ir.rahyar.app)"
            adb exec-out screencap -p > RahYar-0.14.0-compass-middle-right.png || true

      - name: Write validation
        if: success()
        working-directory: source
        run: |
          cat > Validation-0.14.0.txt <<'EOF'
          RahYar 0.14.0 Alpha P0 - Built-in Persian Voice Gate
          ====================================================
          PASS source has no Android TextToSpeech dependency in RahYarV3Activity.
          PASS Persian Piper model is bundled inside the APK and hash-verified.
          PASS sherpa-onnx generated non-silent Persian audio on Android emulator.
          PASS no external Persian voice pack is required for navigation guidance.
          PASS compass is placed physical middle-right.
          PASS v1/v2/v3 signing verification and 16KiB ZIP alignment.
          PASS previous free-drive, navigation, weather, report, overview, feedback and offline regression gates.
          SIGNER: temporary alpha test signer; uninstall prior RahYar before installing this build.
          NOTE: fixed production/update signing key still needs GitHub Actions secret provisioning.
          EOF
          cat RahYar-0.14.0.sha256 >> Validation-0.14.0.txt

      - name: Upload candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.14.0-alpha-p0-builtin-voice
          path: |
            source/RahYar-0.14.0-alpha-p0-builtin-voice.apk
            source/RahYar-0.14.0.sha256
            source/Validation-0.14.0.txt
            source/RahYar-0.14.0-signing.txt
            source/RahYar-0.14.0-alignment.txt
            source/RahYar-0.14.0-simulation.txt
            source/RahYar-0.14.0-logcat.txt
            source/RahYar-0.14.0-compass-middle-right.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nrun_number=%s\nconclusion=%s\nstatus=completed\nupdated_at=%s\nartifact_name=%s\n' '${{ github.run_id }}' '${{ github.run_number }}' '${{ job.status }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'RahYar-0.14.0-alpha-p0-builtin-voice' > /tmp/status.txt
          b64=$(base64 -w0 /tmp/status.txt)
          api="repos/${{ github.repository }}/contents/status/rahyar-0140-voice.txt"
          sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api --method PUT "$api" -f message='Update RahYar 0.14.0 voice status' -f content="$b64" -f sha="$sha" >/dev/null
          else
            gh api --method PUT "$api" -f message='Add RahYar 0.14.0 voice status' -f content="$b64" >/dev/null
          fi
