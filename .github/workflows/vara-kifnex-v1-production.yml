          product=Vara KifNex Smart Wallet
          version=1.0.1
          version_code=100101
          package=ir.kifnex.app
          build_type=release
          debuggable=false
          production_apk_signing=UNSIGNED_REQUIRES_ORGANIZATION_KEY
          production_aab_signing=UNSIGNED_REQUIRES_ORGANIZATION_UPLOAD_KEY
          validation_signature=EPHEMERAL_CI_ONLY_NOT_FOR_DEPLOYMENT
          fixed_otp=absent
          hidden_test_entry=absent
          local_fake_money_movement=disabled_fail_closed
          direct_sms_e2e=pass
          read_sms=absent
          raw_sms_logging=absent
          real_otp_backend=NOT_CONNECTED
          real_payment_switch_backend=NOT_CONNECTED
          go_live_status=REQUIRES_ORGANIZATION_SIGNING_AND_REAL_BACKEND_INTEGRATION
          EOF

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-DIAGNOSTICS
          path: |
            source/kifnex-preview/vara-kifnex-prod-*.txt
            source/kifnex-preview/vara-kifnex-prod-*.xml
            source/kifnex-preview/vara-kifnex-prod-*.png
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-Production-Safe.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production handoff package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-HANDOFF
          path: |
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-UNSIGNED.apk
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-UNSIGNED.aab
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-UNSIGNED.apk.sha256
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-UNSIGNED.aab.sha256
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-OPS-VALIDATION.apk
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-OPS-VALIDATION.sha256
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-PRODUCTION-MANIFEST.txt
            source/kifnex-preview/vara-kifnex-prod-badging.txt
            source/kifnex-preview/vara-kifnex-prod-permissions.txt
            source/kifnex-preview/vara-kifnex-prod-validation-cert.txt
            source/kifnex-preview/vara-kifnex-prod-e2e.txt
            source/kifnex-preview/Vara-KifNex-Smart-Wallet-1.0.1-Production-Safe.png
          if-no-files-found: error
          retention-days: 14

      - name: Publish production status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'Vara KifNex Production CI'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\nproduct=%s\nversion=1.0.1\n' \
            "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" 'Vara KifNex Smart Wallet' \
            > vara-kifnex-prod-status.txt
          git add -- vara-kifnex-prod-status.txt
          git commit -m 'Publish Vara KifNex production status' || true
          git push || true
