name: RahYar External AI Prototype Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rahyar-external-ai-prototype-build.yml'
      - 'triggers/external-ai-prototype.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          ref: feature/rahyar-field-v14-hmi-report-map
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Stage approved IRANSans fonts into res/font
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/rahyar-v13.apk \
            https://github.com/Saeiddvc/RahYar-Alpha05-Open-Build/releases/download/rahyar-0.14.1-field-v13/RahYar-0.14.1-Field-V13.apk
          FONT_DIR="source/external_ai/Rahyar/app/src/main/res/font"
          mkdir -p "$FONT_DIR"
          unzip -p /tmp/rahyar-v13.apk assets/fonts/iransans_fanum_regular.ttf > "$FONT_DIR/iransans_regular.ttf"
          unzip -p /tmp/rahyar-v13.apk assets/fonts/iransans_fanum_medium.ttf > "$FONT_DIR/iransans_medium.ttf"
          unzip -p /tmp/rahyar-v13.apk assets/fonts/iransans_fanum_bold.ttf > "$FONT_DIR/iransans_bold.ttf"
          test -s "$FONT_DIR/iransans_regular.ttf"
          test -s "$FONT_DIR/iransans_medium.ttf"
          test -s "$FONT_DIR/iransans_bold.ttf"
          sha256sum "$FONT_DIR"/*.ttf > RahYar-font-stage.log

      - name: Build debug APK
        working-directory: source/external_ai/Rahyar
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/RahYar-External-AI-build.log"

      - name: Verify APK
        shell: bash
        run: |
          APK="source/external_ai/Rahyar/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee RahYar-External-AI-Prototype.sha256
          cp "$APK" RahYar-External-AI-Prototype.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-External-AI-Diagnostics
          path: |
            RahYar-font-stage.log
            RahYar-External-AI-build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-External-AI-Prototype
          path: |
            RahYar-External-AI-Prototype.apk
            RahYar-External-AI-Prototype.sha256
          if-no-files-found: error
