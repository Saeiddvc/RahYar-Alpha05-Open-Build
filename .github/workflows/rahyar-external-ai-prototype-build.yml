name: RahYar External AI Prototype Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rahyar-external-ai-prototype-build.yml'
      - 'triggers/external-ai-prototype.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          ref: feature/rahyar-field-v14-hmi-report-map
          path: source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct and stage IRANSans fonts
        working-directory: source
        shell: bash
        run: |
          set +e
          {
            python3 tools/reconstruct_iransans_fanum_chunks.py
            code=$?
            if [ "$code" -eq 0 ]; then
              mkdir -p external_ai/Rahyar/app/src/main/res/font
              cp app/src/main/assets/fonts/iransans_fanum_regular.ttf external_ai/Rahyar/app/src/main/res/font/iransans_regular.ttf
              cp app/src/main/assets/fonts/iransans_fanum_medium.ttf external_ai/Rahyar/app/src/main/res/font/iransans_medium.ttf
              cp app/src/main/assets/fonts/iransans_fanum_bold.ttf external_ai/Rahyar/app/src/main/res/font/iransans_bold.ttf
              ls -l external_ai/Rahyar/app/src/main/res/font
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/RahYar-font-stage.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$GITHUB_WORKSPACE/font-stage.exit"
          exit $code

      - name: Build debug APK
        id: gradle_build
        working-directory: source/external_ai/Rahyar
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/RahYar-External-AI-build.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$GITHUB_WORKSPACE/build.exit"
          exit $code

      - name: Verify APK
        id: verify
        shell: bash
        run: |
          APK="source/external_ai/Rahyar/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          sha256sum "$APK" | tee RahYar-External-AI-Prototype.sha256
          cp "$APK" RahYar-External-AI-Prototype.apk

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-External-AI-Diagnostics
          path: |
            RahYar-font-stage.log
            font-stage.exit
            RahYar-External-AI-build.log
            build.exit
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-External-AI-Prototype
          path: |
            RahYar-External-AI-Prototype.apk
            RahYar-External-AI-Prototype.sha256
          if-no-files-found: error
