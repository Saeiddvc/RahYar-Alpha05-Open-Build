name: RahYar 0.14.1 Field-Test Candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0141-fieldtest-trigger.txt'

permissions:
  contents: write
  actions: read

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-stabilization-0141
  FONT_ARTIFACT_ID: '9340495559'

jobs:
  fieldtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate stabilized 0.14.1 source
        working-directory: source
        run: |
          set -euo pipefail
          python tools/stage_rahyar_0140_embedded_tts.py
          python tools/stage_rahyar_0141_multivoice.py
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          python tools/stage_rahyar_0135_ci_typography.py
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py
          python tools/fix_rahyar_0137_feedback_state.py
          python tools/fix_rahyar_0137_feedback_save_gate.py
          python tools/apply_rahyar_0138a_surface.py
          python tools/apply_rahyar_0138b_motion.py
          python tools/apply_rahyar_0138c_free_drive.py
          python tools/apply_rahyar_0138d_weather.py
          python tools/apply_rahyar_0138e_gates.py
          python tools/apply_rahyar_0138f_widget_guard.py
          python tools/apply_rahyar_0138h_tts_restore.py
          python tools/apply_rahyar_0139_ui_behavior.py
          python tools/apply_rahyar_0140_embedded_tts.py
          python tools/apply_rahyar_0141_camera_theme.py
          python tools/apply_rahyar_0141_waypoint_weather.py
          python tools/apply_rahyar_0141_multivoice.py
          python tools/fix_rahyar_0141_voice_personas.py
          python tools/fix_rahyar_0141_voice_icon.py
          python tools/fix_rahyar_0141_voice_service_lifetime.py
          python tools/apply_rahyar_0141_voice_preview_test_hook.py

      - name: Inject approved IRANSans from verified 0.13.9 artifact
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rahyar0139
          gh api "repos/${{ github.repository }}/actions/artifacts/${FONT_ARTIFACT_ID}/zip" > /tmp/rahyar0139.zip
          unzip -q /tmp/rahyar0139.zip -d /tmp/rahyar0139
          OLD_APK="$(find /tmp/rahyar0139 -type f -name '*0.13.9*.apk' | head -1)"
          test -n "$OLD_APK"
          mkdir -p app/src/main/assets/fonts
          unzip -p "$OLD_APK" assets/fonts/iransans_fanum_regular.ttf > app/src/main/assets/fonts/iransans_fanum_regular.ttf
          unzip -p "$OLD_APK" assets/fonts/iransans_fanum_medium.ttf > app/src/main/assets/fonts/iransans_fanum_medium.ttf
          unzip -p "$OLD_APK" assets/fonts/iransans_fanum_bold.ttf > app/src/main/assets/fonts/iransans_fanum_bold.ttf
          echo '1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9  app/src/main/assets/fonts/iransans_fanum_regular.ttf' > /tmp/fonts.sha256
          echo 'd8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0  app/src/main/assets/fonts/iransans_fanum_medium.ttf' >> /tmp/fonts.sha256
          echo '96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19  app/src/main/assets/fonts/iransans_fanum_bold.ttf' >> /tmp/fonts.sha256
          sha256sum -c /tmp/fonts.sha256
          ! grep -q 'b70fe4c64e47e9ea9ba1d190f02533729c42d8112911f70861c27ea9d81e2f9b' /tmp/fonts.sha256
          echo PASS_IRANSANS_APPROVED_HASHES

      - name: Hard product gates
        working-directory: source
        run: |
          set -euo pipefail
          V3=app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          SET=app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java
          grep -q 'versionName = "0.14.1-alpha-p0"' app/build.gradle.kts
          grep -q 'PASS HEADING_UP_DEFAULT' "$V3"
          grep -q 'PASS COMPASS_CONTEXTUAL' "$V3"
          grep -q 'PASS COMPASS_RESET_HEADING' "$V3"
          grep -q 'PASS THEME_DARK_VISIBLE' "$V3"
          grep -q 'v3-waypoint' "$V3"
          grep -q 'WAYPOINT_ROUTE' "$V3"
          grep -q 'مینل · زن' "$SET"
          grep -q 'سعید · مرد' "$SET"
          grep -q '"minel","saeid"' "$SET"
          grep -q 'PROFILE_MINEL' app/src/main/java/ir/rahyar/app/RahYarEmbeddedVoiceEngine.kt
          grep -q 'PROFILE_SAEID' app/src/main/java/ir/rahyar/app/RahYarEmbeddedVoiceEngine.kt
          grep -q 'voices=minel,saeid' app/src/main/assets/rahyar_tts/VOICE_MANIFEST_0141.txt
          grep -q 'default_voice=minel' app/src/main/assets/rahyar_tts/VOICE_MANIFEST_0141.txt
          grep -q 'apparent_temperature' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          grep -q 'relative_humidity_2m' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          grep -q 'surface_pressure' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          ! grep -q 'TextToSpeech' "$V3"
          echo PASS_PRODUCT_SOURCE_GATES

      - name: Build exact field-test APK
        working-directory: source
        run: |
          set -euo pipefail
          gradle assembleDebug -x prepareRahYarSources --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RahYar-0.14.1-alpha-p0-FIELDTEST.apk
          sha256sum RahYar-0.14.1-alpha-p0-FIELDTEST.apk > RahYar-0.14.1-alpha-p0-FIELDTEST.sha256
          python - <<'PY'
          import hashlib,zipfile
          apk='RahYar-0.14.1-alpha-p0-FIELDTEST.apk'
          expected={
            'assets/fonts/iransans_fanum_regular.ttf':'1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9',
            'assets/fonts/iransans_fanum_medium.ttf':'d8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0',
            'assets/fonts/iransans_fanum_bold.ttf':'96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19',
          }
          with zipfile.ZipFile(apk) as z:
            for name,want in expected.items():
              got=hashlib.sha256(z.read(name)).hexdigest()
              assert got==want,(name,got,want)
          print('PASS FINAL_APK_IRANSANS_HASHES')
          PY
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --verbose --print-certs RahYar-0.14.1-alpha-p0-FIELDTEST.apk > RahYar-0.14.1-alpha-p0-signing.txt; else echo 'apksigner unavailable' > RahYar-0.14.1-alpha-p0-signing.txt; fi
          cat RahYar-0.14.1-alpha-p0-FIELDTEST.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Exact APK runtime, navigation and voice gates
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          working-directory: source
          script: |
            adb wait-for-device
            adb install -r RahYar-0.14.1-alpha-p0-FIELDTEST.apk
            adb shell pm disable-user --user 0 com.google.android.tts >/dev/null 2>&1 || true
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity
            sleep 10
            adb shell pidof ir.rahyar.app | grep -q '[0-9]'
            adb logcat -d > RahYar-0.14.1-plain-logcat.txt
            ! grep -E 'FATAL EXCEPTION.*ir.rahyar.app|Fatal signal.*ir.rahyar.app' RahYar-0.14.1-plain-logcat.txt
            adb shell screencap -p /sdcard/rahyar0141-plain.png
            adb pull /sdcard/rahyar0141-plain.png RahYar-0.14.1-plain.png >/dev/null
            adb shell am force-stop ir.rahyar.app
            adb logcat -c
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            for i in $(seq 1 220); do adb logcat -d | grep -q 'RahYarSim.*COMPLETE' && break; sleep .25; done
            adb logcat -d > RahYar-0.14.1-simulation-logcat.txt
            grep RahYarSim RahYar-0.14.1-simulation-logcat.txt > RahYar-0.14.1-simulation.txt || true
            grep -q 'PASS HEADING_UP_DEFAULT' RahYar-0.14.1-simulation.txt
            grep -q 'PASS COMPASS_CONTEXTUAL' RahYar-0.14.1-simulation.txt
            grep -q 'PASS COMPASS_RESET_HEADING' RahYar-0.14.1-simulation.txt
            grep -q 'PASS THEME_DARK_VISIBLE' RahYar-0.14.1-simulation.txt
            grep -q 'PASS WEATHER_VERTICAL' RahYar-0.14.1-simulation.txt
            grep -q 'PASS WEATHER_TAP_DISMISS' RahYar-0.14.1-simulation.txt
            grep -q 'COMPLETE' RahYar-0.14.1-simulation.txt
            ! grep -q 'FAIL' RahYar-0.14.1-simulation.txt
            adb shell am force-stop ir.rahyar.app
            adb logcat -c
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_voice_preview_test true --es voice_profile minel --es voice_language fa
            for i in $(seq 1 360); do adb logcat -d | grep -q 'PASS RAHYAR_VOICE_PLAYED profile=minel lang=fa preview=true' && break; sleep .25; done
            adb logcat -d > RahYar-0.14.1-minel-logcat.txt
            grep -q 'PASS RAHYAR_VOICE_PLAYED profile=minel lang=fa preview=true' RahYar-0.14.1-minel-logcat.txt
            adb shell am force-stop ir.rahyar.app
            adb logcat -c
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_voice_preview_test true --es voice_profile saeid --es voice_language en
            for i in $(seq 1 360); do adb logcat -d | grep -q 'PASS RAHYAR_VOICE_PLAYED profile=saeid lang=en preview=true' && break; sleep .25; done
            adb logcat -d > RahYar-0.14.1-saeid-logcat.txt
            grep -q 'PASS RAHYAR_VOICE_PLAYED profile=saeid lang=en preview=true' RahYar-0.14.1-saeid-logcat.txt
            ! grep -q 'RahYar voice init failed' RahYar-0.14.1-minel-logcat.txt
            ! grep -q 'RahYar voice init failed' RahYar-0.14.1-saeid-logcat.txt
            adb shell pidof ir.rahyar.app | grep -q '[0-9]'

      - name: Upload field-test candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.14.1-alpha-p0-FIELDTEST
          path: |
            source/RahYar-0.14.1-alpha-p0-FIELDTEST.apk
            source/RahYar-0.14.1-alpha-p0-FIELDTEST.sha256
            source/RahYar-0.14.1-alpha-p0-signing.txt
            source/RahYar-0.14.1-plain-logcat.txt
            source/RahYar-0.14.1-simulation.txt
            source/RahYar-0.14.1-simulation-logcat.txt
            source/RahYar-0.14.1-minel-logcat.txt
            source/RahYar-0.14.1-saeid-logcat.txt
            source/RahYar-0.14.1-plain.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nconclusion=%s\nstatus=completed\nupdated_at=%s\nartifact_name=%s\n' '${{ github.run_id }}' '${{ job.status }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'RahYar-0.14.1-alpha-p0-FIELDTEST' > /tmp/status.txt
          b64=$(base64 -w0 /tmp/status.txt); api="repos/${{ github.repository }}/contents/status/rahyar-0141-fieldtest.txt"; sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api --method PUT "$api" -f message='Update RahYar 0.14.1 field-test status' -f content="$b64" -f sha="$sha" >/dev/null; else gh api --method PUT "$api" -f message='Add RahYar 0.14.1 field-test status' -f content="$b64" >/dev/null; fi
