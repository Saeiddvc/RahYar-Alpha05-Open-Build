name: KifNex 0.1.0-alpha.28 Bank Intelligence Pilot

on:
  push:
    paths:
      - 'kifnex028-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REF: kifnex-alpha28-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: buildrepo

      - uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidNavigator-Android
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Apply KifNex source patches
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          python3 patch_alpha21.py
          python3 patch_alpha22.py
          python3 patch_alpha22b.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha23.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha23_ui.py
          python3 patch_alpha24.py || true
          python3 patch_alpha24_datafix.py
          python3 patch_alpha24b_hotfix.py
          python3 patch_alpha24b.py
          python3 patch_alpha24_ui.py
          python3 patch_alpha24_dialogstack.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha25_investmentlab.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha26_realdata.py
          python3 patch_alpha26_testentry.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha27_directsms.py
          python3 patch_alpha21_compilefix.py
          python3 patch_alpha28_bank_intelligence.py
          python3 patch_alpha28_font_fallback.py
          python3 patch_alpha21_compilefix.py
          grep -q 'confirmedDebitTotal' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'نیازمند بررسی شما' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'RECEIVE_SMS' app/src/main/AndroidManifest.xml
          ! grep -q '@font/iransans' app/src/main/res/values/styles.xml

      - name: Prepare stable pilot signing
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          openssl pkcs12 -export -inkey kifnex-alpha-test-key.pem -in kifnex-alpha-test-cert.pem -name kifnex-alpha -out kifnex-alpha-test.p12 -passout pass:kifnexAlpha2026
          rm -f app/kifnex-alpha-test.keystore
          keytool -importkeystore -srckeystore kifnex-alpha-test.p12 -srcstoretype PKCS12 -srcstorepass kifnexAlpha2026 -srcalias kifnex-alpha -destkeystore app/kifnex-alpha-test.keystore -deststoretype JKS -deststorepass kifnexAlpha2026 -destkeypass kifnexAlpha2026 -destalias kifnex-alpha -noprompt

      - name: Deterministic parser and identity tests
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          rm -rf pure-out && mkdir pure-out
          javac -d pure-out \
            app/src/main/java/ir/kifnex/app/InvestmentCalculator.java \
            app/src/main/java/ir/kifnex/app/InvestmentCatalog.java \
            app/src/main/java/ir/kifnex/app/BankSmsAnalyzer.java \
            app/src/main/java/ir/kifnex/app/PersianNameValidator.java \
            calculator-tests/ir/kifnex/app/InvestmentCalculatorTest.java \
            parser-tests/ir/kifnex/app/BankSmsAnalyzerTest.java \
            parser-tests/ir/kifnex/app/PersianNameValidatorTest.java
          java -cp pure-out ir.kifnex.app.InvestmentCalculatorTest | tee kifnex028-calculator-tests.txt
          java -cp pure-out ir.kifnex.app.BankSmsAnalyzerTest | tee kifnex028-bank-parser-tests.txt
          java -cp pure-out ir.kifnex.app.PersianNameValidatorTest | tee kifnex028-name-tests.txt
          grep -q PASSED kifnex028-calculator-tests.txt
          grep -q PASSED kifnex028-bank-parser-tests.txt
          grep -q PASSED kifnex028-name-tests.txt

      - name: Build and inspect APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.28-bank-intelligence.apk
          sha256sum KifNex-0.1.0-alpha.28-bank-intelligence.apk > KifNex-0.1.0-alpha.28-bank-intelligence.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.28-bank-intelligence.apk > kifnex028-badging.txt
          "$AAPT" dump permissions KifNex-0.1.0-alpha.28-bank-intelligence.apk > kifnex028-permissions.txt
          grep -q "package: name='ir.kifnex.app'" kifnex028-badging.txt
          grep -q "versionName='0.1.0-alpha.28'" kifnex028-badging.txt
          grep -q 'android.permission.RECEIVE_SMS' kifnex028-permissions.txt
          ! grep -q 'android.permission.READ_SMS' kifnex028-permissions.txt
          ! unzip -l KifNex-0.1.0-alpha.28-bank-intelligence.apk | grep -qi 'iransans.*\.ttf\|iransans.*\.otf\|iransans.*\.woff'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs KifNex-0.1.0-alpha.28-bank-intelligence.apk > kifnex028-cert.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 real SMS intelligence smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: bash smoke_alpha28.sh

      - name: Upload Alpha28
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.28-bank-intelligence
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.28-bank-intelligence.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.28-bank-intelligence.sha256
            source/kifnex-preview/kifnex028-cert.txt
            source/kifnex-preview/kifnex028-badging.txt
            source/kifnex-preview/kifnex028-permissions.txt
            source/kifnex-preview/kifnex028-calculator-tests.txt
            source/kifnex-preview/kifnex028-bank-parser-tests.txt
            source/kifnex-preview/kifnex028-name-tests.txt
            source/kifnex-preview/kifnex028-bank-intelligence.png
            source/kifnex-preview/kifnex028.xml
            source/kifnex-preview/kifnex028-package.txt
            source/kifnex-preview/kifnex028-logcat.txt
            source/kifnex-preview/kifnex028-real-sms-test.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          printf 'status=%s\nrun_id=%s\nsource_ref=%s\n' "$JOB_STATUS" "$GITHUB_RUN_ID" "$SOURCE_REF" > kifnex028-status.txt
          git add kifnex028-status.txt
          git commit -m 'Publish KifNex Alpha28 status' || true
          git push || true
