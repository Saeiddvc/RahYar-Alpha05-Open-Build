name: RahYar 0.13.6 Navigation Final Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0136-trigger.txt'

permissions:
  contents: read

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-p0-stability-0131

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Checkout private RahYar source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare RahYar 0.13.6 source
        working-directory: source
        run: |
          set -euo pipefail
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          mkdir -p app/src/main/assets/fonts
          cp app/src/main/assets/fonts/b_traffic.ttf app/src/main/assets/fonts/iransans_fanum_regular.ttf
          cp app/src/main/assets/fonts/b_traffic.ttf app/src/main/assets/fonts/iransans_fanum_medium.ttf
          cp app/src/main/assets/fonts/b_traffic.ttf app/src/main/assets/fonts/iransans_fanum_bold.ttf
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          assert 'versionCode = 31' in s and 'versionName = "0.13.4-alpha-p0"' in s
          s=s.replace('versionCode = 31','versionCode = 32',1).replace('versionName = "0.13.4-alpha-p0"','versionName = "0.13.5-alpha-p0"',1)
          p.write_text(s)
          PY
          python tools/apply_rahyar_0136_navigation_control.py

      - name: Gate navigation controls
        working-directory: source
        run: |
          set -euo pipefail
          test -s app/src/main/assets/fonts/iransans_fanum_regular.ttf
          test -s app/src/main/assets/fonts/iransans_fanum_medium.ttf
          test -s app/src/main/assets/fonts/iransans_fanum_bold.ttf
          grep -q 'createFromAsset(getAssets(), "fonts/iransans_fanum_regular.ttf")' app/src/main/java/ir/rahyar/app/RahYarApplication.java
          grep -q 'createFromAsset(getAssets(), "fonts/iransans_fanum_medium.ttf")' app/src/main/java/ir/rahyar/app/RahYarApplication.java
          grep -q 'createFromAsset(getAssets(), "fonts/iransans_fanum_bold.ttf")' app/src/main/java/ir/rahyar/app/RahYarApplication.java
          grep -q 'setCompassEnabled(true)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'setContentDescription("پایان مسیر")' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'confirmStopNavigation' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'navigationMotion.accept(location,activeRoute,this::renderNavigationMotion)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'PASS HEADING_ROUTE_ALIGNED' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'STOP_CONTROL_MISSING' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'routeBearing(targetLat, targetLon, route)' app/src/main/java/ir/rahyar/app/RahYarNavigationMotionController.java
          grep -q 'versionName = "0.13.6-alpha-p0"' app/build.gradle.kts

      - name: Compile APK
        working-directory: source
        run: gradle assembleDebug -x prepareRahYarSources --stacktrace

      - name: Verify APK identity
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > rahyar-badging.txt
          grep -q "package: name='ir.rahyar.app'" rahyar-badging.txt
          grep -q "application-label:'راه‌یار'" rahyar-badging.txt
          grep -q 'versionName=.0.13.6-alpha-p0.' rahyar-badging.txt
          unzip -l "$APK" > rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_regular.ttf' rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_medium.ttf' rahyar-apk-files.txt
          grep -q 'assets/fonts/iransans_fanum_bold.ttf' rahyar-apk-files.txt
          cp "$APK" RahYar-0.13.6-alpha-p0-ci.apk
          sha256sum RahYar-0.13.6-alpha-p0-ci.apk > RahYar-0.13.6-alpha-p0-ci.sha256

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate heading stop control and full journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source
          script: |
            set -eu
            adb install -r RahYar-0.13.6-alpha-p0-ci.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            sleep 7.6
            adb exec-out screencap -p > RahYar-0.13.6-stop-control-screen.png || true
            sleep 12
            adb logcat -d > RahYar-0.13.6-logcat.txt || true
            grep RahYarSim RahYar-0.13.6-logcat.txt > RahYar-0.13.6-simulation.txt || true
            adb shell dumpsys activity activities > RahYar-0.13.6-activities.txt || true
            adb exec-out screencap -p > RahYar-0.13.6-final-screen.png || true
            echo '=== RAHYAR SIMULATION ==='
            cat RahYar-0.13.6-simulation.txt || true
            echo '=== RAHYAR FATAL/PROCESS DIAGNOSTICS ==='
            grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: ir.rahyar.app|RahYarSim.*FAIL' RahYar-0.13.6-logcat.txt || true
            echo '=== PID ==='
            adb shell pidof ir.rahyar.app || true
            grep -q 'PASS HOME' RahYar-0.13.6-simulation.txt
            grep -q 'PASS SEARCH' RahYar-0.13.6-simulation.txt
            grep -q 'PASS LONG_PRESS_PIN' RahYar-0.13.6-simulation.txt
            grep -q 'PASS ROUTE_PREVIEW' RahYar-0.13.6-simulation.txt
            grep -q 'PASS NAVIGATION' RahYar-0.13.6-simulation.txt
            grep -q 'PASS HEADING_ROUTE_ALIGNED' RahYar-0.13.6-simulation.txt
            grep -q 'PASS STOP_CONTROL' RahYar-0.13.6-simulation.txt
            grep -q 'PASS WAYPOINT_MENU' RahYar-0.13.6-simulation.txt
            grep -q 'PASS REPORT_MENU' RahYar-0.13.6-simulation.txt
            grep -q 'PASS OVERVIEW' RahYar-0.13.6-simulation.txt
            grep -q 'COMPLETE' RahYar-0.13.6-simulation.txt
            grep -q 'PASS OFFLINE_ACTIVITY' RahYar-0.13.6-simulation.txt
            ! grep -q 'FAIL' RahYar-0.13.6-simulation.txt
            ! grep -q 'FATAL EXCEPTION.*ir.rahyar.app' RahYar-0.13.6-logcat.txt

      - name: Upload RahYar 0.13.6 build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.13.6-alpha-p0-navigation-ci
          path: |
            source/RahYar-0.13.6-alpha-p0-ci.apk
            source/RahYar-0.13.6-alpha-p0-ci.sha256
            source/rahyar-badging.txt
            source/rahyar-apk-files.txt
            source/RahYar-0.13.6-simulation.txt
            source/RahYar-0.13.6-logcat.txt
            source/RahYar-0.13.6-activities.txt
            source/RahYar-0.13.6-stop-control-screen.png
            source/RahYar-0.13.6-final-screen.png
          if-no-files-found: warn
          retention-days: 14
