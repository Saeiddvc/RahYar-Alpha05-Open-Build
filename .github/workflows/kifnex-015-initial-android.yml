name: KifNex 0.1.0-alpha.15 Initial Android

on:
  push:
    paths:
      - 'kifnex015-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: kifnex-alpha15-android

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"

      - name: Checkout private KifNex source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare IRANSans product typography
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' \
            -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' \
            -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' \
            -o app/src/main/res/font/iransans_fanum_bold.ttf
          echo '1df818a6b400da053448a007729d548436e76bdee48d52647bc2ed69a6ff62f9  app/src/main/res/font/iransans_fanum_regular.ttf' | sha256sum -c -
          echo 'd8ab70132d0e59cd873a1fa212a6ae8b2867495a013fa55484615c360ce74cc0  app/src/main/res/font/iransans_fanum_medium.ttf' | sha256sum -c -
          echo '96d8e88e864c66c15447f27429711f6c3e5d14c5d9d633edd2bf6c22f870dd19  app/src/main/res/font/iransans_fanum_bold.ttf' | sha256sum -c -

      - name: Compile KifNex APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" KifNex-0.1.0-alpha.15-initial-android.apk
          sha256sum KifNex-0.1.0-alpha.15-initial-android.apk > KifNex-0.1.0-alpha.15-initial-android.sha256

      - name: Verify APK identity
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          APK=KifNex-0.1.0-alpha.15-initial-android.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > kifnex-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex-badging.txt
          grep -q "application-label:'کیف‌نکس'" kifnex-badging.txt
          grep -q "versionName='0.1.0-alpha.15'" kifnex-badging.txt
          unzip -l "$APK" > kifnex-apk-files.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -e
            adb install -r KifNex-0.1.0-alpha.15-initial-android.apk
            adb logcat -c
            adb shell am start -n ir.kifnex.app/.MainActivity
            sleep 8
            test -n "$(adb shell pidof ir.kifnex.app)"
            adb exec-out screencap -p > kifnex-alpha15-home.png
            adb logcat -d > kifnex-alpha15-logcat.txt
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex-alpha15-logcat.txt

      - name: Upload validated KifNex Android build
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.15-initial-android
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.15-initial-android.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.15-initial-android.sha256
            source/kifnex-preview/kifnex-badging.txt
            source/kifnex-preview/kifnex-apk-files.txt
            source/kifnex-preview/kifnex-alpha15-home.png
            source/kifnex-preview/kifnex-alpha15-logcat.txt
          if-no-files-found: error
          retention-days: 14
