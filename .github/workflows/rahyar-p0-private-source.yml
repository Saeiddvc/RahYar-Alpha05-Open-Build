name: RahYar P0 Product Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'p0-trigger.txt'

permissions:
  contents: read

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-p0-stability-0131

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private-source credential
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: |
          test -n "$SOURCE_TOKEN" || { echo "RAHYAR_SOURCE_TOKEN is not configured."; exit 2; }

      - name: Checkout private RahYar product source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify product identity brand and P0 source gates
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'applicationId = "ir.rahyar.app"' app/build.gradle.kts
          grep -q 'versionName = "0.13.0-alpha-p0"' app/build.gradle.kts
          grep -q 'android:label="@string/rahyar_product_name"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".RahYarV3Activity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".RahYarHudActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".RahYarTripStoryActivity"' app/src/main/AndroidManifest.xml
          grep -q 'همراه هوشمند مسیر شما' app/src/main/res/values/brand.xml
          grep -q '#0A2342' app/src/main/res/values/colors.xml
          test -s app/src/main/res/drawable/ic_rahyar_foreground.xml
          test -s app/src/main/res/drawable/ic_rahyar_monochrome.xml
          test -s app/src/main/res/drawable/logo_rahyar_splash.xml
          test -s app/src/main/res/drawable/logo_rahyar_mark.xml
          test -s app/src/main/res/drawable/ic_rahyar_notification.xml
          test -s branding/source/RahYar_Logo_Primary.svg
          test -s branding/RahYar_Brand_Guide.md
          test -s branding/Brand-Implementation-Note.md
          test -s docs/RAHYAR_NESHAN_PARITY_BASELINE_LOCK.md
          test -s tools/apply_rahyar_neshan_parity.py
          test -s tools/apply_rahyar_brand_runtime.py
          test -s tools/apply_rahyar_icon_polish.py
          test -s tools/apply_rahyar_search_waypoint_stability.py
          test -s tools/apply_rahyar_navigation_motion.py
          test -s tools/apply_rahyar_field_stability_0131.py
          test -s tools/apply_rahyar_readability_stability_0132.py
          test -s app/src/main/java/ir/rahyar/app/RahYarNavigationMotionController.java
          test -s app/src/main/java/ir/rahyar/app/RahYarLocationStabilityGate.java
          test -s app/src/main/java/ir/rahyar/app/RahYarPuckFactory.java
          test -s app/src/main/java/ir/rahyar/app/RahYarPinnedPointStore.java
          test -s app/src/main/java/ir/rahyar/app/RahYarSavedRouteStore.java
          test -s app/src/main/java/ir/rahyar/app/RahYarSmartRestController.java
          test -s app/src/main/java/ir/rahyar/app/RahYarWaypointSession.java
          test -s app/src/main/java/ir/rahyar/app/RahYarTripStorySession.java
          test -s app/src/main/java/ir/rahyar/app/RahYarTripStoryActivity.java
          test -s app/src/main/java/ir/rahyar/app/RahYarHudActivity.java
          ! grep -Rqi 'Organic Maps' app/src/main/AndroidManifest.xml app/src/main/java/ir/rahyar/app || exit 9

      - name: Apply Neshan-parity baseline interactions
        working-directory: source
        run: python tools/apply_rahyar_neshan_parity.py

      - name: Apply locked RahYar runtime brand and legacy compatibility
        working-directory: source
        run: python tools/apply_rahyar_brand_runtime.py

      - name: Apply RahYar icon polish
        working-directory: source
        run: python tools/apply_rahyar_icon_polish.py

      - name: Apply strict local search and waypoint stability
        working-directory: source
        run: python tools/apply_rahyar_search_waypoint_stability.py

      - name: Prepare P0 product wiring
        working-directory: source
        run: gradle prepareRahYarSources --stacktrace

      - name: Apply continuous navigation motion and distinct puck
        working-directory: source
        run: python tools/apply_rahyar_navigation_motion.py

      - name: Apply 0.13.1 field stability UX and map modes
        working-directory: source
        run: python tools/apply_rahyar_field_stability_0131.py

      - name: Apply 0.13.2 driving readability and crash resilience
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_rahyar_readability_stability_0132.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('b = BUBBLE.read_text(encoding="utf-8")nb = b','b = BUBBLE.read_text(encoding="utf-8")\n')
          p.write_text(s,encoding='utf-8')
          PY
          python tools/apply_rahyar_readability_stability_0132.py

      - name: Build actual RahYar APK
        working-directory: source
        run: gradle assembleDebug -x prepareRahYarSources --stacktrace

      - name: Verify generated APK identity
        working-directory: source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > rahyar-badging.txt
          grep -q "package: name='ir.rahyar.app'" rahyar-badging.txt
          grep -q "application-label:'راه‌یار'" rahyar-badging.txt
          grep -q 'versionName=.0.13.2-alpha-p0.' rahyar-badging.txt
          sha256sum "$APK" > RahYar-0.13.2-alpha-p0.sha256
          cp "$APK" RahYar-0.13.2-alpha-p0.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run V3 critical journey simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source
          script: |
            set -e
            adb install -r RahYar-0.13.2-alpha-p0.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true
            sleep 20
            adb logcat -d > RahYar-P0-full-log.txt
            grep RahYarSim RahYar-P0-full-log.txt > RahYar-P0-simulation.txt || true
            echo '--- RahYar simulation events ---'
            cat RahYar-P0-simulation.txt || true
            adb exec-out screencap -p > RahYar-P0-simulation.png
            adb shell pidof ir.rahyar.app > RahYar-P0-pid.txt
            test -s RahYar-P0-pid.txt
            grep -q 'PASS HOME' RahYar-P0-simulation.txt
            grep -q 'PASS SEARCH' RahYar-P0-simulation.txt
            grep -q 'PASS LONG_PRESS_PIN' RahYar-P0-simulation.txt
            grep -q 'PASS ROUTE_PREVIEW' RahYar-P0-simulation.txt
            grep -q 'PASS NAVIGATION' RahYar-P0-simulation.txt
            grep -q 'PASS WAYPOINT_MENU' RahYar-P0-simulation.txt
            grep -q 'PASS REPORT_MENU' RahYar-P0-simulation.txt
            grep -q 'PASS OVERVIEW' RahYar-P0-simulation.txt
            grep -q 'COMPLETE' RahYar-P0-simulation.txt
            if grep -q 'FAIL' RahYar-P0-simulation.txt; then exit 11; fi
            if grep -q 'Process: ir.rahyar.app' RahYar-P0-full-log.txt; then echo 'RahYar process crash detected'; exit 12; fi

      - name: Gate P0 compiled features readability and stability
        working-directory: source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.13.2-alpha-p0"' app/build.gradle.kts
          grep -q 'SafetyEngine.begin(route)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarSmartRestController.maybeSuggest' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'showSaveRoutePrompt' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarHudActivity.class' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarTripStoryActivity.class' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'updateTrip' app/src/main/java/ir/rahyar/app/RahYarV1CarAppService.java
          grep -q 'addOnMapLongClickListener' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'consumePinnedDestination' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'cycleMapMode' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'probeAndApplySatellite' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'install3DBuildings' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'ProgressBar spinner' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarLocationStabilityGate' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'locationGate.accept' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'projectToRoute' app/src/main/java/ir/rahyar/app/RahYarNavigationMotionController.java
          grep -q 'navigationMotion.accept(location,activeRoute' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'searchNear(q,location.getLatitude(),location.getLongitude())' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'waypointLoading' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'bounded=1&countrycodes=ir' app/src/main/java/ir/rahyar/app/OpenNavCore.java
          grep -q 'addLayerBelow(rl,LOC_HALO_LAYER)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'ValueAnimator' app/src/main/java/ir/rahyar/app/RahYarNavigationMotionController.java
          grep -q 'RahYarBrand.NAVY' app/src/main/java/ir/rahyar/app/RahYarPuckFactory.java
          grep -q 'navInstruction=text("",20f' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'navSummary=text("",15.5f' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'اختلال GPS؛ موقعیت شما تقریبی است' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'safeAction(String name' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'setTextSize(12.3f)' app/src/main/java/ir/rahyar/app/RahYarIconTextView.java
          grep -q 'Level.EXPANDED?20' app/src/main/java/ir/rahyar/app/RahYarBubbleView.java

      - name: Upload P0 APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.13.2-alpha-p0-readability
          path: |
            source/RahYar-0.13.2-alpha-p0.apk
            source/RahYar-0.13.2-alpha-p0.sha256
            source/rahyar-badging.txt
            source/RahYar-P0-simulation.txt
            source/RahYar-P0-full-log.txt
            source/RahYar-P0-simulation.png
          if-no-files-found: warn
          retention-days: 14
