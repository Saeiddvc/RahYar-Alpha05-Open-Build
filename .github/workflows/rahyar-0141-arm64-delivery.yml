name: RahYar 0.14.1 ARM64 Delivery

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0141-arm64-trigger.txt'

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-stabilization-0141

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate 0.14.1 runtime-fixed universal candidate
        working-directory: source
        run: |
          set -euo pipefail
          python tools/stage_rahyar_0140_embedded_tts.py
          python tools/stage_rahyar_0141_multivoice.py
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          python tools/stage_rahyar_0135_ci_typography.py
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py
          python tools/fix_rahyar_0137_feedback_state.py
          python tools/fix_rahyar_0137_feedback_save_gate.py
          python tools/apply_rahyar_0138a_surface.py
          python tools/apply_rahyar_0138b_motion.py
          python tools/apply_rahyar_0138c_free_drive.py
          python tools/apply_rahyar_0138d_weather.py
          python tools/apply_rahyar_0138e_gates.py
          python tools/apply_rahyar_0138f_widget_guard.py
          python tools/apply_rahyar_0138h_tts_restore.py
          python tools/apply_rahyar_0139_ui_behavior.py
          python tools/apply_rahyar_0140_embedded_tts.py
          python tools/apply_rahyar_0141_camera_theme.py
          python tools/apply_rahyar_0141_waypoint_weather.py
          python tools/apply_rahyar_0141_multivoice.py
          python tools/fix_rahyar_0141_voice_personas.py
          python tools/fix_rahyar_0141_voice_icon.py
          python tools/fix_rahyar_0141_voice_service_lifetime.py
          python tools/apply_rahyar_0141_voice_preview_test_hook.py
          python tools/apply_rahyar_0141_settings_hotfix.py

          # Replace the CI typography placeholder with a real IRANSans FaNum face.
          curl -fL --retry 3 --connect-timeout 15 \
            'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' \
            -o /tmp/rahyar-iransans.ttf
          test "$(stat -c%s /tmp/rahyar-iransans.ttf)" -gt 90000
          fc-scan --format '%{family}\n' /tmp/rahyar-iransans.ttf | grep -qi 'IRANSans'
          test "$(sha256sum /tmp/rahyar-iransans.ttf | cut -d' ' -f1)" != 'b70fe4c64e47e9ea9ba1d190f02533729c42d8112911f70861c27ea9d81e2f9b'
          cp /tmp/rahyar-iransans.ttf app/src/main/assets/fonts/iransans_fanum_regular.ttf
          cp /tmp/rahyar-iransans.ttf app/src/main/assets/fonts/iransans_fanum_medium.ttf
          cp /tmp/rahyar-iransans.ttf app/src/main/assets/fonts/iransans_fanum_bold.ttf
          test ! -e app/src/main/assets/fonts/b_traffic.ttf
          sha256sum /tmp/rahyar-iransans.ttf > RahYar-0.14.1-IRANSans.sha256

          # Enforce the selected family through all ordinary text views and expose explicit map-layer choices.
          python tools/apply_rahyar_0141_runtime_closeout.py
          rm -rf app/src/main/assets/rahyar_tts/vits-piper-fa_IR-amir-medium

          grep -q 'versionCode = 38' app/build.gradle.kts
          grep -q 'versionName = "0.14.1-alpha-p0"' app/build.gradle.kts
          grep -q 'PASS RAHYAR_VOICE_ESPEAK_DATA' app/src/main/java/ir/rahyar/app/RahYarEmbeddedVoiceEngine.kt
          grep -q 'showMapLayerPanel' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'applyMapModeSelection' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarTypography.applyTree(root)' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'RahYarTypography.applyTree(body)' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java
          grep -q 'مینل · زن' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java
          grep -q 'سعید · مرد' app/src/main/java/ir/rahyar/app/RahYarSettingsActivity.java
          for P in app/src/main/assets/fonts/iransans_fanum_regular.ttf app/src/main/assets/fonts/iransans_fanum_medium.ttf app/src/main/assets/fonts/iransans_fanum_bold.ttf; do
            test -s "$P"
            fc-scan --format '%{family}\n' "$P" | grep -qi 'IRANSans'
            test "$(sha256sum "$P" | cut -d' ' -f1)" != 'b70fe4c64e47e9ea9ba1d190f02533729c42d8112911f70861c27ea9d81e2f9b'
          done

          gradle assembleDebug -x prepareRahYarSources --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RahYar-0.14.1-runtime-universal-CI.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prove real Minel and Saeid runtime
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          working-directory: source
          script: |
            set -eu
            adb install -r RahYar-0.14.1-runtime-universal-CI.apk
            adb shell pm disable-user --user 0 com.google.android.tts >/dev/null 2>&1 || true

            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_voice_preview_test true --es voice_profile minel --es voice_language fa
            for i in $(seq 1 360); do adb logcat -d | grep -q 'PASS RAHYAR_VOICE_PLAYED profile=minel lang=fa preview=true' && break; sleep .5; done
            adb logcat -d > RahYar-0.14.1-minel-runtime.txt
            grep -q 'Bundled IRANSans FaNum family installed' RahYar-0.14.1-minel-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_ESPEAK_DATA profile=minel' RahYar-0.14.1-minel-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_READY profile=minel' RahYar-0.14.1-minel-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_PLAYED profile=minel lang=fa preview=true' RahYar-0.14.1-minel-runtime.txt
            ! grep -q 'copy the espeak-ng-data directory' RahYar-0.14.1-minel-runtime.txt
            ! grep -q 'RahYar voice init failed' RahYar-0.14.1-minel-runtime.txt

            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_voice_preview_test true --es voice_profile saeid --es voice_language en
            for i in $(seq 1 360); do adb logcat -d | grep -q 'PASS RAHYAR_VOICE_PLAYED profile=saeid lang=en preview=true' && break; sleep .5; done
            adb logcat -d > RahYar-0.14.1-saeid-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_ESPEAK_DATA profile=saeid' RahYar-0.14.1-saeid-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_READY profile=saeid' RahYar-0.14.1-saeid-runtime.txt
            grep -q 'PASS RAHYAR_VOICE_PLAYED profile=saeid lang=en preview=true' RahYar-0.14.1-saeid-runtime.txt
            ! grep -q 'copy the espeak-ng-data directory' RahYar-0.14.1-saeid-runtime.txt
            ! grep -q 'RahYar voice init failed' RahYar-0.14.1-saeid-runtime.txt
            adb shell pidof ir.rahyar.app | grep -q '[0-9]'
            adb exec-out screencap -p > RahYar-0.14.1-runtime-screen.png

      - name: Build final ARM64 after runtime gate
        working-directory: source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          s=p.read_text()
          marker='defaultConfig {'
          assert marker in s
          if 'abiFilters += listOf("arm64-v8a")' not in s:
              s=s.replace(marker,marker+'\n        ndk { abiFilters += listOf("arm64-v8a") }',1)
          p.write_text(s)
          PY
          gradle clean assembleDebug -x prepareRahYarSources --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk
          sha256sum RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk > RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.sha256
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk > RahYar-0.14.1-badging.txt
          grep -q "package: name='ir.rahyar.app'" RahYar-0.14.1-badging.txt
          grep -q "versionCode='38'" RahYar-0.14.1-badging.txt
          grep -q "versionName='0.14.1-alpha-p0'" RahYar-0.14.1-badging.txt
          unzip -l RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk | grep -q 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -p RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk assets/fonts/iransans_fanum_regular.ttf > /tmp/rahyar-font.ttf
          fc-scan --format '%{family}\n' /tmp/rahyar-font.ttf | grep -qi 'IRANSans'
          test "$(sha256sum /tmp/rahyar-font.ttf | cut -d' ' -f1)" != 'b70fe4c64e47e9ea9ba1d190f02533729c42d8112911f70861c27ea9d81e2f9b'
          ls -lh RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk

      - name: Upload runtime-fixed ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED
          path: |
            source/RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk
            source/RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.sha256
            source/RahYar-0.14.1-IRANSans.sha256
            source/RahYar-0.14.1-badging.txt
            source/RahYar-0.14.1-minel-runtime.txt
            source/RahYar-0.14.1-saeid-runtime.txt
            source/RahYar-0.14.1-runtime-screen.png
          retention-days: 14

      - name: Publish delivery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE=$(stat -c%s source/RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED.apk 2>/dev/null || echo 0)
          printf 'run_id=%s\nstatus=%s\nsize_bytes=%s\nartifact_name=%s\nupdated_at=%s\n' '${{ github.run_id }}' '${{ job.status }}' "$SIZE" 'RahYar-0.14.1-alpha-p0-ARM64-RUNTIME-FIXED' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/status.txt
          b64=$(base64 -w0 /tmp/status.txt)
          api="repos/${{ github.repository }}/contents/status/rahyar-0141-arm64-delivery.txt"
          sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api --method PUT "$api" -f message='Update RahYar 0.14.1 ARM64 delivery status' -f content="$b64" -f sha="$sha" >/dev/null; else gh api --method PUT "$api" -f message='Add RahYar 0.14.1 ARM64 delivery status' -f content="$b64" >/dev/null; fi
