name: Publish RahYar 0.14.1 Field V6 Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'publish-rahyar-v6-release-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download successful Field V6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Saeiddvc/RahYar-Alpha05-Open-Build/actions/artifacts/9572805256/zip > /tmp/rahyar-v6.zip
          mkdir -p /tmp/rahyar-v6
          unzip -q /tmp/rahyar-v6.zip -d /tmp/rahyar-v6
          APK=$(find /tmp/rahyar-v6 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ./RahYar-0.14.1-Field-V6.apk
          sha256sum RahYar-0.14.1-Field-V6.apk > RahYar-0.14.1-Field-V6.apk.sha256
          ls -lh RahYar-0.14.1-Field-V6.apk

      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='rahyar-0.14.1-field-v6'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'RahYar 0.14.1 Field V6' --notes 'Field V6: local off-route detection, offline status, contextual companion, low-latency voice priming, truthful mid-route routing, orange waypoint leg, keep-screen-on.'
          fi
          gh release upload "$TAG" RahYar-0.14.1-Field-V6.apk RahYar-0.14.1-Field-V6.apk.sha256 --clobber
