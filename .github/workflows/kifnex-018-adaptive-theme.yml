name: KifNex 0.1.0-alpha.20 Logo + Persistent Appearance

on:
  push:
    paths:
      - 'kifnex018-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: kifnex-alpha20-android

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build-status repository
        uses: actions/checkout@v4
        with:
          path: buildrepo
          fetch-depth: 1
      - name: Require private source token
        env:
          SOURCE_TOKEN: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
        run: test -n "$SOURCE_TOKEN"
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
      - name: Apply Alpha20 UI fixes
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          python3 patch_alpha20.py
          grep -q 'showAppearancePage' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'drawFinancialNode' app/src/main/java/ir/kifnex/app/MainActivity.java
          grep -q 'applySystemBars' app/src/main/java/ir/kifnex/app/MainActivity.java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare IRANSans
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29.ttf' -o app/src/main/res/font/iransans_fanum_regular.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Medium.ttf' -o app/src/main/res/font/iransans_fanum_medium.ttf
          curl -fL --retry 3 'https://professor.masoudkargar.ir/assets/font/IRANSans4/Farsi_numerals/IRANSans%28FaNum%29_Bold.ttf' -o app/src/main/res/font/iransans_fanum_bold.ttf
          fc-scan --format='%{family}\n' app/src/main/res/font/iransans_fanum_regular.ttf | grep -qi IRANSans
      - name: Compile APK
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk KifNex-0.1.0-alpha.20-logo-theme-stay.apk
          sha256sum KifNex-0.1.0-alpha.20-logo-theme-stay.apk > KifNex-0.1.0-alpha.20-logo-theme-stay.sha256
      - name: Verify identity
        working-directory: source/kifnex-preview
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump badging KifNex-0.1.0-alpha.20-logo-theme-stay.apk > kifnex020-badging.txt
          grep -q "package: name='ir.kifnex.app'" kifnex020-badging.txt
          grep -q "versionName='0.1.0-alpha.20'" kifnex020-badging.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime light and dark smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: source/kifnex-preview
          script: |
            set -eu
            adb install -r KifNex-0.1.0-alpha.20-logo-theme-stay.apk
            adb shell pm clear ir.kifnex.app
            adb shell cmd uimode night no
            adb shell am start -n ir.kifnex.app/.MainActivity --ez kifnex_test_registered true
            sleep 4
            adb shell uiautomator dump /sdcard/kifnex020-light.xml >/dev/null
            adb pull /sdcard/kifnex020-light.xml kifnex020-light.xml >/dev/null
            grep -q 'قدرت خرید کل' kifnex020-light.xml
            adb exec-out screencap -p > kifnex020-light.png
            adb shell am force-stop ir.kifnex.app
            adb shell cmd uimode night yes
            adb shell am start -n ir.kifnex.app/.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/kifnex020-dark.xml >/dev/null
            adb pull /sdcard/kifnex020-dark.xml kifnex020-dark.xml >/dev/null
            grep -q 'قدرت خرید کل' kifnex020-dark.xml
            adb exec-out screencap -p > kifnex020-dark.png
            adb logcat -d > kifnex020-logcat.txt
            test -n "$(adb shell pidof ir.kifnex.app)"
            ! grep -q 'FATAL EXCEPTION.*ir.kifnex.app' kifnex020-logcat.txt
      - name: Upload validated build
        uses: actions/upload-artifact@v4
        with:
          name: KifNex-0.1.0-alpha.20-logo-theme-stay
          path: |
            source/kifnex-preview/KifNex-0.1.0-alpha.20-logo-theme-stay.apk
            source/kifnex-preview/KifNex-0.1.0-alpha.20-logo-theme-stay.sha256
            source/kifnex-preview/kifnex020-badging.txt
            source/kifnex-preview/kifnex020-light.xml
            source/kifnex-preview/kifnex020-light.png
            source/kifnex-preview/kifnex020-dark.xml
            source/kifnex-preview/kifnex020-dark.png
            source/kifnex-preview/kifnex020-logcat.txt
            source/kifnex-preview/app/src/main/java/ir/kifnex/app/MainActivity.java
          retention-days: 14
      - name: Publish status
        if: always()
        working-directory: buildrepo
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          git config user.name 'KifNex CI Status'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase || true
          cat > kifnex020-status.txt <<EOF
          status=${JOB_STATUS}
          run_id=${GITHUB_RUN_ID}
          source_ref=${SOURCE_REF}
          updated=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git add kifnex020-status.txt
          git commit -m 'Publish KifNex Alpha20 status' || true
          git push || true
