name: Publish RahYar 0.14.1 Field V12 Release

on:
  push:
    paths:
      - 'publish-rahyar-v12-release-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download successful Field V12 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Saeiddvc/RahYar-Alpha05-Open-Build/actions/artifacts/9664342341/zip > /tmp/rahyar-v12.zip
          mkdir -p /tmp/rahyar-v12
          unzip -q /tmp/rahyar-v12.zip -d /tmp/rahyar-v12
          APK=$(find /tmp/rahyar-v12 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ./RahYar-0.14.1-Field-V12.apk
          sha256sum RahYar-0.14.1-Field-V12.apk > RahYar-0.14.1-Field-V12.apk.sha256
          ls -lh RahYar-0.14.1-Field-V12.apk
      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='rahyar-0.14.1-field-v12'
          NOTES='Field V12 urgent location hotfix: runtime location permission no longer depends on map-style completion; app rechecks permission and restarts location after returning from Android Settings; recenter button bootstraps location instead of becoming a no-op; GPS/network providers are started only when enabled; first valid location can recenter the map and feed weather/navigation. Includes V11 feature baseline. Voice accent is unchanged and remains separate quality work.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'RahYar 0.14.1 Field V12' --notes "$NOTES"
          fi
          gh release upload "$TAG" RahYar-0.14.1-Field-V12.apk RahYar-0.14.1-Field-V12.apk.sha256 --clobber
