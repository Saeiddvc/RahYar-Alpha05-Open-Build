name: RahYar 0.13.9 Visual Proof

on:
  workflow_dispatch:
  push:
    paths:
      - 'release0139-visual-trigger.txt'

permissions:
  contents: write

env:
  SOURCE_REPO: Saeiddvc/SaeidNavigator-Android
  SOURCE_REF: feature/rahyar-p0-ui-0139

jobs:
  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.RAHYAR_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate final 0.13.9 source with visual holds
        working-directory: source
        run: |
          set -euo pipefail
          python tools/apply_rahyar_neshan_parity.py
          python tools/apply_rahyar_brand_runtime.py
          python tools/apply_rahyar_icon_polish.py
          python tools/apply_rahyar_search_waypoint_stability.py
          gradle prepareRahYarSources --stacktrace
          python tools/apply_rahyar_navigation_motion.py
          python tools/apply_rahyar_field_stability_0131.py
          python tools/apply_rahyar_readability_stability_0132.py
          python tools/apply_rahyar_0133_uxfixes.py
          python tools/apply_rahyar_0133_layer_state.py
          python tools/apply_rahyar_0133_validation_hook.py
          python tools/apply_rahyar_0134_traffic_font.py
          python tools/stage_rahyar_0135_ci_typography.py
          python tools/apply_rahyar_0136_navigation_control.py
          python tools/apply_rahyar_0136_weather_guard.py
          python tools/apply_rahyar_0137_closeout_feedback.py
          python tools/fix_rahyar_0137_feedback_state.py
          python tools/fix_rahyar_0137_feedback_save_gate.py
          python tools/apply_rahyar_0138a_surface.py
          python tools/apply_rahyar_0138b_motion.py
          python tools/apply_rahyar_0138c_free_drive.py
          python tools/apply_rahyar_0138d_weather.py
          python tools/apply_rahyar_0138e_gates.py
          python tools/apply_rahyar_0138f_widget_guard.py
          python tools/apply_rahyar_0138h_tts_restore.py
          python tools/apply_rahyar_0139_ui_behavior.py
          python tools/apply_rahyar_0139_visual_gate_timing.py
          grep -q 'versionName = "0.13.9-alpha-p0"' app/build.gradle.kts
          grep -q 'sim(10000,"WEATHER_TAP_DISMISS"' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'sim(10500,"THEME_DARK_APPLIED"' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
          grep -q 'sim(14500,"OVERVIEW"' app/src/main/java/ir/rahyar/app/RahYarV3Activity.java
      - name: Build debug visual candidate
        working-directory: source
        run: |
          set -euo pipefail
          gradle assembleDebug -x prepareRahYarSources --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture deterministic visual states
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -no-snapshot-save
          disable-animations: true
          working-directory: source
          script: |
            adb wait-for-device
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop ir.rahyar.app
            adb shell am start -n ir.rahyar.app/.RahYarV3Activity --ez rahyar_simulation true --ez rahyar_validate_offline true
            for i in $(seq 1 160); do adb logcat -d | grep -q 'PASS COMPASS_VISIBLE' && break; sleep .15; done
            adb shell screencap -p /sdcard/0139-compass.png
            adb pull /sdcard/0139-compass.png RahYar-0.13.9-VISUAL-compass.png >/dev/null
            for i in $(seq 1 160); do adb logcat -d | grep -q 'PASS SUN_TIMES_VISIBLE' && break; sleep .15; done
            adb shell screencap -p /sdcard/0139-weather.png
            adb pull /sdcard/0139-weather.png RahYar-0.13.9-VISUAL-weather-sun.png >/dev/null
            for i in $(seq 1 200); do adb logcat -d | grep -q 'PASS THEME_DARK_APPLIED' && break; sleep .15; done
            adb shell screencap -p /sdcard/0139-dark.png
            adb pull /sdcard/0139-dark.png RahYar-0.13.9-VISUAL-dark-theme.png >/dev/null
            sleep 9
            adb logcat -d > RahYar-0.13.9-VISUAL-logcat.txt
            grep RahYarSim RahYar-0.13.9-VISUAL-logcat.txt > RahYar-0.13.9-VISUAL-simulation.txt || true
            grep -q 'PASS COMPASS_VISIBLE' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'PASS SUN_TIMES_VISIBLE' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'PASS WEATHER_TAP_DISMISS' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'PASS THEME_DARK_APPLIED' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'PASS OVERVIEW_COMPACT' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'PASS OFFLINE_ACTIVITY' RahYar-0.13.9-VISUAL-simulation.txt
            grep -q 'COMPLETE' RahYar-0.13.9-VISUAL-simulation.txt
            ! grep -q 'FAIL' RahYar-0.13.9-VISUAL-simulation.txt
            ! grep -q 'FATAL EXCEPTION.*ir.rahyar.app' RahYar-0.13.9-VISUAL-logcat.txt
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahYar-0.13.9-visual-proof
          path: |
            source/RahYar-0.13.9-VISUAL-compass.png
            source/RahYar-0.13.9-VISUAL-weather-sun.png
            source/RahYar-0.13.9-VISUAL-dark-theme.png
            source/RahYar-0.13.9-VISUAL-simulation.txt
            source/RahYar-0.13.9-VISUAL-logcat.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Publish visual status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'run_id=%s\nconclusion=%s\nstatus=completed\nupdated_at=%s\nartifact_name=%s\n' '${{ github.run_id }}' '${{ job.status }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'RahYar-0.13.9-visual-proof' > /tmp/status.txt
          b64=$(base64 -w0 /tmp/status.txt); api="repos/${{ github.repository }}/contents/status/rahyar-0139-visual.txt"; sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then gh api --method PUT "$api" -f message='Update RahYar 0.13.9 visual status' -f content="$b64" -f sha="$sha" >/dev/null; else gh api --method PUT "$api" -f message='Add RahYar 0.13.9 visual status' -f content="$b64" >/dev/null; fi
