name: Publish RahYar 0.14.1 Field V11 Release

on:
  push:
    paths:
      - 'publish-rahyar-v11-release-trigger.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download successful Field V11 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/Saeiddvc/RahYar-Alpha05-Open-Build/actions/artifacts/9662228273/zip > /tmp/rahyar-v11.zip
          mkdir -p /tmp/rahyar-v11
          unzip -q /tmp/rahyar-v11.zip -d /tmp/rahyar-v11
          APK=$(find /tmp/rahyar-v11 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" ./RahYar-0.14.1-Field-V11.apk
          sha256sum RahYar-0.14.1-Field-V11.apk > RahYar-0.14.1-Field-V11.apk.sha256
          ls -lh RahYar-0.14.1-Field-V11.apk
      - name: Create or update public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='rahyar-0.14.1-field-v11'
          NOTES='Field V11: Enter/IME triggers destination search directly; explicit final-destination flag plus typed waypoint marker; compact settings header and lower driving cockpit; better-route optimization wording separated from mandatory off-route rerouting; driver-first shortcut set prioritizes fuel, parking and service-complex access while retaining V10 road-sign speed HUD, LHD/RHD cockpit, alley-origin routing, current-point reroute, PiP, Android Auto path and embedded voice baseline. Voice accent remains field-validation/open-quality work and is not claimed fixed in this release.'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'RahYar 0.14.1 Field V11' --notes "$NOTES"
          fi
          gh release upload "$TAG" RahYar-0.14.1-Field-V11.apk RahYar-0.14.1-Field-V11.apk.sha256 --clobber
