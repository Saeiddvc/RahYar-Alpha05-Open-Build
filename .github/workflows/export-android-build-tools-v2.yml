name: Export Android Build Tools v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'export-build-tools-v2-trigger.txt'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install and package Android build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;36.0.0'
          mkdir -p export/build-tools
          cp -a "$ANDROID_HOME/build-tools/36.0.0/." export/build-tools/
          test -x export/build-tools/zipalign
          test -x export/build-tools/apksigner
          test -x export/build-tools/aapt
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36-linux
          path: export/build-tools
          retention-days: 2
